<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classement Ligue — Live</title>
<link rel="stylesheet" href="/mpg-tokens.css">
<link rel="stylesheet" href="/theme.css">
<style>
  :root {
    --green: var(--accent-green); --green-dark: var(--accent-green);
    --gold: #d9a441; --live-red: #e0393e;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 14px 60px; }
  a.back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-size: 0.85em; margin-bottom: 14px; }
  a.back-link:hover { color: var(--accent-green); }

  header { margin-bottom: 18px; }
  header h1 { font-size: 1.5em; margin: 0 0 10px; color: var(--text-navy); font-weight: 800; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  #league-select, #gameweek-input {
    background: var(--card-alt); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 5px 9px; font-size: 0.82em; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  #gameweek-input { width: 3.5em; cursor: text; text-align: center; }
  .gw-label { font-size: 0.78em; color: var(--muted); }
  header .sub { font-size: 0.8em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live-red); display: inline-block; animation: pulse 1.3s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .search-row { margin-bottom: 12px; }
  .search-row input {
    width: 100%; background: var(--card-alt); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font-size: 0.95em; font-family: inherit;
  }

  .table-scroll { overflow-x: auto; border-radius: 10px; }
  table.classement-table { width: 100%; border-collapse: collapse; font-size: 0.82em; white-space: nowrap; }
  .classement-table th, .classement-table td { padding: 7px 8px; text-align: left; }
  .classement-table th { color: var(--muted); font-weight: 600; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.3px; }
  .classement-table td.rank { width: 2.2em; color: var(--muted); font-variant-numeric: tabular-nums; border-left: 4px solid transparent; }
  .classement-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .classement-table td.points { font-weight: 700; color: var(--green); }
  .classement-table td.division { color: var(--muted); }
  .classement-table tbody tr { border-top: 1px solid var(--border); }
  .classement-table tbody tr:hover { background: var(--card-alt); }
  .classement-table tbody tr.hidden { display: none; }
  .classement-table tbody tr.me { font-weight: 700; }
  .classement-table tbody tr.me td { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.35); }
  .classement-table tbody tr.me td.points { color: #fff; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
  .mini-badge {
    font-size: 0.72em; background: var(--card-alt); border: 1px solid var(--border);
    border-radius: 999px; padding: 1px 6px; color: var(--gold); white-space: nowrap;
  }

  .status-msg { display: block; text-align: center; color: var(--muted); font-size: 0.85em; margin-top: 20px; }
  .status-msg.err { color: #c9484a; }
</style>
</head>
<body>
<div class="app-header">
  <a class="app-title" href="/">MPG</a>
  <nav>
    <a href="/">Managers</a>
    <a href="/poules">Poules</a>
    <a href="/classement-ligue" class="active">Classement ligue</a>
    <a href="/super-classement">Super classement</a>
    <a href="/simulator">Simulateur</a>
    <a href="/comptes">Comptes</a>
    <a href="/config">Barèmes</a>
    <a href="/token">Token API</a>
  </nav>
</div>
<div class="wrap">
  <a class="back-link" id="back-link" href="/">‹ Managers</a>
  <header>
    <h1 class="section-bar">Classement <span id="league-name">…</span></h1>
    <div class="controls">
      <select id="league-select"><option>…</option></select>
      <span class="gw-label">J</span><input id="gameweek-input" type="number" min="1" value="1">
    </div>
    <div class="sub"><span class="live-dot"></span> <span id="updated">chargement…</span></div>
  </header>

  <div class="search-row">
    <input type="text" id="search" placeholder="Rechercher un manager…">
  </div>

  <div id="classement"><span class="status-msg">Chargement…</span></div>
</div>

<script>
// Nav reservee aux admins (retour utilisateur 2026-08-23 : "à garder pour
// le ou les admins que je désigne") -- masque les 4 liens admin-only du nav
// tant que la session n'est pas authentifiee comme un admin (cf.
// core/auth.py::ADMIN_USER_IDS). Ne remplace PAS la protection reelle de
// chaque page (gate propre a admin.html/comptes.html/simulator.html/
// token.html) -- sert juste a ne pas les ANNONCER a un visiteur non-admin.
(async function hideAdminNavIfNeeded() {
  try {
    const res = await fetch('/api/auth/status');
    const status = await res.json();
    if (!status.isAdmin) {
      document.querySelectorAll(
        '.app-header nav a[href="/simulator"], .app-header nav a[href="/comptes"], .app-header nav a[href="/config"], .app-header nav a[href="/token"]'
      ).forEach(a => a.remove());
    }
  } catch (err) { /* pas bloquant -- nav complete par defaut si le check echoue */ }
})();

const params = new URLSearchParams(location.search);
let leagues = [];
let currentLeague = params.get('ligue') || 'QLRBXDCX2';
let currentSeason = params.get('season') || null;
let currentGameweek = params.get('gameweek') || '1';
let gameweekWasExplicit = params.has('gameweek');
// userId d'origine (fil d'Ariane manager -> ce classement) -- meme principe
// que /poules et /super-classement : surligne SA ligne, retour pointe vers
// SA page plutot que la racine Managers. Repli sur la session connectee
// (retour utilisateur 2026-08-23 : "toujours pas de surbrillance... pour
// l'utilisateur connecté") si aucun ?id= explicite -- avant ce correctif,
// arriver ici via le nav (sans passer par /manager?id=...) ne surlignait
// jamais rien, meme en etant authentifie.
let originUserId = params.get('id');
let colorByName = {};
let highlightName = null;

function updateUrl() {
  const url = new URL(location.href);
  url.searchParams.set('ligue', currentLeague);
  url.searchParams.set('season', currentSeason);
  url.searchParams.set('gameweek', currentGameweek);
  if (originUserId) url.searchParams.set('id', originUserId);
  history.replaceState(null, '', url);
}

function bonusPillsHtml(row) {
  const keys = ['Pichichi', 'Le_Mur', 'Bonus_Champion', 'Bonus_Podium'];
  const entries = keys.filter(k => row[k]);
  if (!entries.length) return '';
  return `<div class="badge-row">${entries.map(k => `<span class="mini-badge">${k} +${row[k]}</span>`).join('')}</div>`;
}

function rowHtml(row) {
  const name = (row.player_name || '').toLowerCase();
  const color = colorByName[name] || 'transparent';
  const isMe = highlightName && name === highlightName;
  const played = (row.victory ?? 0) + (row.draw ?? 0) + (row.defeat ?? 0);
  const rowStyle = isMe ? ` style="background:${color}"` : '';
  return `
    <tr data-name="${name}" class="${isMe ? 'me' : ''}"${rowStyle}>
      <td class="rank" style="border-left-color:${color}">#${row.rang}</td>
      <td>
        ${row.player_name || ''}
        ${bonusPillsHtml(row)}
      </td>
      <td class="num division">${row.division ?? ''}</td>
      <td class="num points">${row.points ?? 0}</td>
      <td class="num">${played}</td>
      <td class="num">${row.victory ?? 0}</td>
      <td class="num">${row.draw ?? 0}</td>
      <td class="num">${row.defeat ?? 0}</td>
      <td class="num">${row['score+'] ?? 0}</td>
      <td class="num">${row['score-'] ?? 0}</td>
      <td class="num">${(row.score_diff ?? 0) > 0 ? '+' : ''}${row.score_diff ?? 0}</td>
    </tr>`;
}

async function loadManagerColors() {
  if (!originUserId) {
    try {
      const authRes = await fetch('/api/auth/status');
      const authStatus = await authRes.json();
      if (authStatus.loggedInUserId) originUserId = authStatus.loggedInUserId;
    } catch (err) { /* pas bloquant */ }
  }
  try {
    const res = await fetch('/api/managers');
    const data = await res.json();
    (data.managers || []).forEach(m => {
      if (m.markerColour) colorByName[(m.realName || '').toLowerCase()] = m.markerColour;
    });
    if (originUserId) {
      const m = (data.managers || []).find(mm => mm.userId === originUserId);
      if (m) {
        highlightName = (m.realName || '').toLowerCase();
        const back = document.getElementById('back-link');
        back.href = `/manager?id=${encodeURIComponent(originUserId)}`;
        back.textContent = `‹ ${m.realName}`;
      }
    }
  } catch (err) { /* pas bloquant */ }
}

async function chargerClassement() {
  const el = document.getElementById('classement');
  try {
    const res = await fetch(`/api/league-classement?shortId=${currentLeague}&season=${currentSeason}&gameweek=${currentGameweek}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    const rows = data.rows || [];
    if (!rows.length) {
      el.innerHTML = '<span class="status-msg">Aucune donnée disponible pour cette journée.</span>';
      return;
    }
    el.innerHTML = `
      <div class="table-scroll">
        <table class="classement-table">
          <thead><tr>
            <th>#</th><th>Manager</th><th>Div</th><th title="Total officiel pondéré + bonus">Points</th><th>Joués</th>
            <th>V</th><th>N</th><th>D</th><th>B+</th><th>B-</th><th>Diff</th>
          </tr></thead>
          <tbody>${rows.map(rowHtml).join('')}</tbody>
        </table>
      </div>`;
    applyFilter();
    document.getElementById('updated').textContent = `maj ${new Date().toLocaleTimeString('fr-FR')}`;
  } catch (err) {
    el.innerHTML = `<span class="status-msg err">Erreur : ${err.message}</span>`;
  }
}

async function resolveCurrentGameweek() {
  if (gameweekWasExplicit) return;
  try {
    const res = await fetch(`/api/simulate-gameweeks?shortId=${currentLeague}&season=${currentSeason}`);
    const data = await res.json();
    const weeks = data.gameweeks || [];
    if (weeks.length) currentGameweek = String(Math.max(...weeks));
  } catch (err) { /* reste sur la valeur courante */ }
  document.getElementById('gameweek-input').value = currentGameweek;
}

async function loadLeagues() {
  const res = await fetch('/api/leagues');
  const data = await res.json();
  leagues = data.leagues || [];

  const select = document.getElementById('league-select');
  select.innerHTML = leagues.map(l => `<option value="${l.code}">${l.nom}</option>`).join('');

  if (!leagues.find(l => l.code === currentLeague) && leagues.length) {
    currentLeague = leagues[0].code;
  }
  select.value = currentLeague;

  const league = leagues.find(l => l.code === currentLeague);
  if (!currentSeason && league) currentSeason = String(league.seasonSearch);
  document.getElementById('league-name').textContent = league ? league.nom : currentLeague;
  document.title = `Classement — ${league ? league.nom : currentLeague}`;
  await resolveCurrentGameweek();
}

document.getElementById('league-select').addEventListener('change', async (e) => {
  currentLeague = e.target.value;
  const league = leagues.find(l => l.code === currentLeague);
  currentSeason = league ? String(league.seasonSearch) : currentSeason;
  gameweekWasExplicit = false;
  await resolveCurrentGameweek();
  updateUrl();
  document.getElementById('league-name').textContent = league ? league.nom : currentLeague;
  document.title = `Classement — ${league ? league.nom : currentLeague}`;
  chargerClassement();
});

document.getElementById('gameweek-input').addEventListener('change', (e) => {
  currentGameweek = e.target.value || '1';
  gameweekWasExplicit = true;
  updateUrl();
  chargerClassement();
});

function applyFilter() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  document.querySelectorAll('#classement tbody tr').forEach(tr => {
    tr.classList.toggle('hidden', query && !tr.dataset.name.includes(query));
  });
}
document.getElementById('search').addEventListener('input', applyFilter);

(async function init() {
  await Promise.all([loadLeagues(), loadManagerColors()]);
  updateUrl();
  await chargerClassement();
  setInterval(chargerClassement, 60000);
})();
</script>
</body>
</html>
