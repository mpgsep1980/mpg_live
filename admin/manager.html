<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPG — Manager</title>
<link rel="stylesheet" href="/mpg-tokens.css">
<link rel="stylesheet" href="/theme.css">
<style>
  :root {
    --green: var(--accent-green); --green-dark: var(--accent-green);
    --ball-real: #16201a; --ball-mpg: var(--accent-green); --gold: #d9a441; --live-red: #e0393e;
    --ball-csc-classique: #e0b400;
    --accent: var(--green); /* MarkerColour du manager, injecte en JS (chargerHeader) -- repli sur le vert par defaut */
  }
  body {
    background: color-mix(in srgb, var(--accent) 8%, var(--bg));
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 14px 60px; }
  .narrow { max-width: 480px; }

  .back-link {
    display: inline-flex; align-items: center; gap: 4px; color: var(--muted);
    text-decoration: none; font-size: 0.85em; margin-bottom: 12px;
  }
  .back-link:hover { color: var(--green); }
  .top-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .top-nav a {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    text-decoration: none; font-size: 0.8em; font-weight: 600; border-radius: 999px; padding: 6px 12px;
  }
  .top-nav a:hover { border-color: var(--accent); color: var(--accent); }

  header { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  header .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--selected-bg); object-fit: cover; }
  header h1 { font-size: 1.4em; margin: 0; color: var(--text-navy); font-weight: 800; }

  .blason-wrap { text-align: center; margin-bottom: 20px; }
  .blason-wrap .blason { width: 180px; height: 180px; object-fit: contain; }

  section { margin-bottom: 22px; }
  section h2 {
    font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; gap: 6px;
  }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }

  .rank-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .rank-value { font-size: 1.6em; font-weight: 800; color: var(--green); }
  .rank-label { color: var(--muted); font-size: 0.85em; }
  .caveat { color: var(--muted); font-size: 0.72em; margin-top: 8px; }

  .league-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 0; border-top: 1px solid var(--border); font-size: 0.88em;
  }
  .league-row:first-child { border-top: none; }
  .league-row .place { color: var(--gold); font-weight: 700; min-width: 2em; }
  .league-row .points { color: var(--muted); font-variant-numeric: tabular-nums; }
  .league-row.subtotal { border-top: 2px solid var(--border); margin-top: 4px; font-weight: 700; }
  .league-row.subtotal .points { color: var(--green); font-size: 1.05em; }
  .points-explain { font-size: 0.68em; color: var(--muted); margin: 8px 0 2px; }
  .points-explain:first-of-type { margin-top: 2px; }

  .bonus-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .bonus-pill {
    background: var(--card-alt); border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 10px; font-size: 0.75em; display: flex; gap: 5px;
  }
  .bonus-pill .v { color: var(--green); font-weight: 700; }

  /* 192 matchs/saison a terme (6 ligues) -- une liste plate (meme "poupees
     russes" repliees) devient vite trop longue a parcourir. Une colonne par
     ligue (nom en en-tete), chaque match = un bouton compact d'une ligne
     (D{division} · J{gameweek}, score) ; le detail (buteurs, bonus,
     compositions, classement de division) s'ouvre dans une popover au clic
     plutot qu'inline -- retour utilisateur 2026-08-16. Desktop : 6 colonnes
     cote a cote (.wrap fait 1400px, assez large). Mobile : onglets (une
     ligue a la fois, retour utilisateur -- pas de scroll horizontal ni
     d'empilement vertical des 6 colonnes). */
  .league-tabs {
    display: none; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 2px;
  }
  .league-tabs button {
    flex: none; background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 0.8em; font-weight: 600;
    font-family: inherit; cursor: pointer; white-space: nowrap;
  }
  .league-tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .leagues-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .league-column { min-width: 0; }
  .league-column-header {
    font-weight: 700; font-size: 0.8em; color: var(--accent); margin-bottom: 6px;
    text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .league-matches { display: flex; flex-direction: column; gap: 6px; }

  .match-btn {
    display: block; width: 100%; text-align: left; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; padding: 7px 9px;
    font-family: inherit; color: var(--text); cursor: pointer; min-width: 0;
  }
  .match-btn:hover { border-color: var(--accent); }
  .match-btn.is-live { border-color: var(--live-red); }
  /* Score simule ("Mon Bonus" actif sur ce match, cf. matchButtonHtml) --
     meme langage visuel que .scenario-active dans la popover (bordure
     pointillee --gold) pour que la tuile et la popover racontent clairement
     la MEME chose au lieu de se contredire (retour utilisateur 2026-08-17 :
     "je suis 10e/72 (l'effet de la victoire) mais avec un match nul live
     affichant toujours 2-2" -- la tuile montrait l'ancien score reel pendant
     que le classement, lui, suivait deja la simulation). */
  .match-btn.is-simulated { border: 1px dashed var(--gold); }
  .sim-badge { flex: none; }
  .match-btn-meta {
    display: flex; align-items: center; gap: 5px; font-size: 0.62em; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 3px;
  }
  .match-btn-score {
    display: block; font-size: 0.78em; font-weight: 700; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .match-btn-score .n { font-variant-numeric: tabular-nums; color: var(--green); }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--live-red);
    display: inline-block; animation: pulse 1.3s infinite; flex: none;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  @media (max-width: 900px) {
    .league-tabs { display: flex; }
    .leagues-grid { grid-template-columns: 1fr; }
    .league-column { display: none; }
    .league-column.active-tab { display: block; }
  }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 24px 12px; overflow-y: auto; z-index: 10;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
    max-width: 480px; width: 100%; padding: 16px;
  }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
  .modal-header h2 { font-size: 0.85em; margin: 0; color: var(--accent); font-weight: 700; }
  #match-modal-close {
    background: none; border: none; color: var(--muted); font-size: 1.4em;
    line-height: 1; cursor: pointer; padding: 2px 6px; flex: none;
  }
  .match-card-body { margin-top: 0; }
  .manager-match-label {
    font-size: 0.62em; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.4px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;
    gap: 6px;
  }
  .manager-match-label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .manager-match-label a { color: var(--muted); text-decoration: none; flex: none; }
  .manager-match-label a:hover { color: var(--green); }
  .archived-badge {
    background: var(--card-alt); border: 1px solid var(--border); border-radius: 999px;
    padding: 1px 6px; font-weight: 700; letter-spacing: 0;
  }
  .score-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
  .team-name {
    display: block; font-weight: 700; font-size: 0.78em; text-align: center; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; color: inherit; text-decoration: none;
  }
  a.team-name:hover { color: var(--accent); }
  .team-name .sub-team { display: block; font-weight: 400; font-size: 0.85em; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score { font-size: 1.3em; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap; }

  .scorers { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; margin-top: 8px; }
  .scorers-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .scorers-col.away { align-items: flex-end; text-align: right; }
  .scorer-row { display: flex; align-items: center; gap: 5px; font-size: 0.68em; min-width: 0; }
  .scorer-row span:not(.ball):not(.scorer-time) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scorers-col.away .scorer-row { flex-direction: row-reverse; }
  .ball { flex: none; width: 8px; height: 8px; border-radius: 50%; }
  .ball.real { background: var(--ball-real); }
  .ball.mpg { background: var(--ball-mpg); }
  /* CSC Rotaldo (malus, 1 tous les 3 Rotaldo -- cf. core.scoring._rotaldo_count)
     en rouge, distinct du CSC "classique" (but contre son camp reel d'un
     joueur adverse aligne dans ce match, cf. core.live_scoring.
     _own_goals_scored_by_player) en jaune -- retour utilisateur 2026-08-23,
     les deux etaient jusque-la indiscernables (rouge -> gris via --muted,
     classique -> confondu avec un but reel via --ball-real). */
  .ball.csc { background: var(--live-red); }
  .ball.real_og { background: var(--ball-csc-classique); }
  .scorer-time { color: var(--muted); font-size: 0.85em; flex: none; }
  .no-scorer { color: var(--muted); font-size: 0.78em; font-style: italic; }
  .scorer-caveat {
    font-size: 0.65em; color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, transparent);
    border-radius: 6px; padding: 5px 8px; margin-top: 8px; line-height: 1.35;
  }

  .lineup-expander { margin-top: 10px; }
  .lineup-expander summary {
    cursor: pointer; font-size: 0.68em; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.4px; padding: 6px 0; border-top: 1px solid var(--border);
    list-style: none;
  }
  .lineup-expander summary::-webkit-details-marker { display: none; }
  .lineup-expander summary::before { content: '▸ '; }
  .lineup-expander[open] summary::before { content: '▾ '; }
  .lineup-expander summary:hover { color: var(--green); }

  .bonus-controls { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
  .bonus-line { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .bonus-line label { font-size: 0.6em; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; flex: none; width: 5.5em; }
  .bonus-select {
    flex: 1; min-width: 0; background: var(--card-alt); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 3px 4px; font-size: 0.65em; font-family: inherit;
  }
  .scenario-result { font-size: 0.65em; color: var(--gold); margin-top: 2px; min-height: 1.2em; }
  .scenario-result.err { color: #c9484a; }
  .scenario-active { border: 1px dashed var(--gold); border-radius: 10px; }

  .sweep-panel { margin-top: 8px; }
  .sweep-title {
    font-size: 0.6em; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px;
    margin-bottom: 4px;
  }
  .sweep-table { width: 100%; border-collapse: collapse; font-size: 0.62em; max-height: 220px; }
  .sweep-scroll { max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
  .sweep-table td { padding: 3px 6px; border-top: 1px solid var(--border); white-space: nowrap; }
  .sweep-table tr:first-child td { border-top: none; }
  .sweep-table .sweep-label { overflow: hidden; text-overflow: ellipsis; max-width: 9em; white-space: nowrap; }
  .sweep-table .sweep-score { text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
  .sweep-table .sweep-swing { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sweep-table .sweep-swing.bad { color: #c9484a; }
  .sweep-table .sweep-swing.neutral { color: var(--muted); font-weight: 400; }
  .sweep-table thead .sweep-head td {
    position: sticky; top: 0; background: var(--card); color: var(--muted);
    text-transform: uppercase; font-size: 0.9em; letter-spacing: 0.3px; font-weight: 700;
    border-top: none; border-bottom: 1px solid var(--border);
  }

  .odds-title { font-size: 0.6em; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; margin: 8px 0 4px; }
  .odds-bar {
    display: flex; height: 20px; border-radius: 6px; overflow: hidden;
    border: 1px solid var(--border); font-size: 0.62em; font-weight: 700;
  }
  .odds-seg { display: flex; align-items: center; justify-content: center; color: #fff; min-width: 0; overflow: hidden; white-space: nowrap; }
  .odds-seg.win { background: #4caf50; }
  .odds-seg.draw { background: var(--gold); color: #10160f; }
  .odds-seg.loss { background: #c9484a; }
  .odds-caption { font-size: 0.62em; color: var(--muted); margin-top: 4px; }

  .position-block { margin-top: 8px; }
  .position-label {
    font-size: 0.58em; text-transform: uppercase; letter-spacing: 0.4px;
    color: var(--muted); text-align: center; margin: 6px 0 4px;
    border-top: 1px solid var(--border); padding-top: 6px;
  }
  .position-label.line-avg-row {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px;
  }
  .line-avg { font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; font-size: 1.05em; text-transform: none; }
  .player-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px; padding: 2px 0; }
  .player { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .player.away { flex-direction: row-reverse; text-align: right; }
  .player-name { font-size: 0.65em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sep { text-align: center; color: var(--border); font-size: 0.65em; }
  .badge {
    flex: none; width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.62em; font-weight: 700; color: #10160f;
    font-variant-numeric: tabular-nums; position: relative;
  }
  .badge.note-high { background: #4caf50; color: #fff; }
  .badge.note-mid { background: var(--gold); }
  .badge.note-low { background: #c9484a; color: #fff; }
  .badge.note-none { background: var(--border); color: var(--muted); }
  .badge.aura-boost { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--gold), 0 0 7px 2px var(--gold); }
  .badge.aura-nerf { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #c9484a, 0 0 7px 2px #c9484a; }
  .captain-flag {
    position: absolute; top: -4px; right: -4px; width: 11px; height: 11px;
    border-radius: 50%; background: #2b6fd1; color: #fff; font-size: 0.5em;
    display: flex; align-items: center; justify-content: center; font-weight: 800;
    border: 1px solid var(--card);
  }
  .goal-flag {
    position: absolute; bottom: -4px; right: -4px; width: 11px; height: 11px;
    border-radius: 50%; background: var(--ball-mpg);
    border: 1px solid var(--card);
  }
  .replaced-note {
    display: block; font-size: 0.85em; color: var(--muted); font-style: italic;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .status-msg { display: block; text-align: center; color: var(--muted); font-size: 0.85em; margin-top: 12px; }
  .status-msg.err { color: #c9484a; }

  .div-classement-table { width: 100%; border-collapse: collapse; font-size: 0.65em; white-space: nowrap; }
  .div-classement-table th, .div-classement-table td { padding: 3px 5px; text-align: center; }
  .div-classement-table th { color: var(--muted); font-weight: 600; font-size: 0.85em; }
  .div-classement-table td:nth-child(2) { text-align: left; overflow: hidden; text-overflow: ellipsis; max-width: 8em; white-space: nowrap; }
  .div-classement-table tbody tr { border-top: 1px solid var(--border); }
  .div-classement-table tbody tr.me { background: color-mix(in srgb, var(--accent) 16%, transparent); font-weight: 700; }
  .div-classement-table td.points { font-weight: 700; color: var(--green); }
  .div-classement-table td.badge-count { color: var(--muted); }
  .div-classement-table td.badge-count.active { color: var(--text); font-weight: 700; }

  .auth-widget { margin-bottom: 16px; }
  .auth-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.85em;
  }
  .auth-card.owner { border-color: var(--green); }
  .auth-card input[type="password"] {
    background: var(--card-alt); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 8px; font-size: 0.95em; font-family: inherit; flex: 1; min-width: 120px;
  }
  .auth-card button {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 6px 12px; font-size: 0.9em; font-weight: 700; cursor: pointer;
  }
  .auth-card button.secondary { background: var(--card-alt); color: var(--text); border: 1px solid var(--border); }
  .auth-card .auth-msg { font-size: 0.85em; color: var(--muted); flex-basis: 100%; }
  .auth-card .auth-msg.err { color: #c9484a; }
  .bonus-locked {
    margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px;
    font-size: 0.68em; color: var(--muted); text-align: center;
  }
</style>
</head>
<body>
<div class="app-header">
  <a class="app-title" href="/">MPG</a>
  <nav>
    <a href="/">Managers</a>
    <a id="nav-poules" href="/poules">Poules</a>
    <a id="nav-classement-ligue" href="/classement-ligue">Classement ligue</a>
    <a id="nav-super-classement" href="/super-classement">Super classement</a>
    <a href="/simulator">Simulateur</a>
    <a href="/comptes">Comptes</a>
    <a href="/config">Barèmes</a>
    <a href="/token">Token API</a>
  </nav>
</div>
<div class="wrap">
  <a class="back-link" href="/">‹ Managers</a>
  <header>
    <img id="avatar" class="avatar" src="" alt="" style="display:none;">
    <h1 id="manager-name">…</h1>
  </header>

  <div id="auth-widget" class="auth-widget narrow"></div>

  <div class="blason-wrap">
    <img id="blason" class="blason" src="" alt="" style="display:none;">
  </div>

  <section class="narrow">
    <h2>Super Classement (provisoire)</h2>
    <div id="classement"><span class="status-msg">Chargement…</span></div>
  </section>

  <section>
    <h2>Matchs</h2>
    <div id="league-tabs" class="league-tabs"></div>
    <div id="leagues-grid" class="leagues-grid"><span class="status-msg">Chargement…</span></div>
  </section>
</div>

<div id="match-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modal-match-title">Match</h2>
      <button id="match-modal-close" aria-label="Fermer">×</button>
    </div>
    <div id="match-modal-body"><span class="status-msg">Chargement…</span></div>
  </div>
</div>

<script>
// Nav reservee aux admins (retour utilisateur 2026-08-23 : "à garder pour
// le ou les admins que je désigne") -- masque les 4 liens admin-only du nav
// tant que la session n'est pas authentifiee comme un admin (cf.
// core/auth.py::ADMIN_USER_IDS). Ne remplace PAS la protection reelle de
// chaque page (gate propre a admin.html/comptes.html/simulator.html/
// token.html) -- sert juste a ne pas les ANNONCER a un visiteur non-admin.
(async function hideAdminNavIfNeeded() {
  try {
    const res = await fetch('/api/auth/status');
    const status = await res.json();
    if (!status.isAdmin) {
      document.querySelectorAll(
        '.app-header nav a[href="/simulator"], .app-header nav a[href="/comptes"], .app-header nav a[href="/config"], .app-header nav a[href="/token"]'
      ).forEach(a => a.remove());
    }
  } catch (err) { /* pas bloquant -- nav complete par defaut si le check echoue */ }
})();

const params = new URLSearchParams(location.search);
const userId = params.get('id');
const POSITION_LABELS = { 1: 'G', 2: 'D', 3: 'M', 4: 'A' };

// Porte son propre userId vers le Super Classement (reperer/surligner sa
// ligne la-bas) ET vers les Poules -- sert aussi de fil d'Ariane : ces pages
// peuvent alors faire pointer leur bouton retour vers CETTE page plutot que
// systematiquement la racine /  (retour utilisateur 2026-08-13 : "le bouton
// de retour me propose de revenir a la page principale... on peut imaginer
// une cascade Managers > 'User' > Classement").
if (userId) {
  document.getElementById('nav-super-classement').href = `/super-classement?id=${encodeURIComponent(userId)}`;

// Connecte "en tant que CE manager" (session par onglet/page, pas globale au
// site -- volontaire, cf. /api/auth/status docstring cote serveur) -- pilote
// l'affichage des controles de bonus (retour utilisateur 2026-08-12 :
// "chaque joueur creera rapidement un compte, ça evitera les fuites de bonus
// involontaire... je ne veux pas d'acces aux bonus des autres"). Le serveur
// re-verifie systematiquement (jamais fait confiance au seul JS), cette
// valeur ne sert qu'a l'affichage.
let isOwner = false;

// MarkerColour personnel de chaque manager (userId -> couleur), peuple par
// chargerHeader() -- repere visuel par ligne dans les tableaux de
// classement (retour utilisateur 2026-08-13).
let colorByUserId = {};

function adminNavLink(href, label) {
  return `<a class="secondary" href="${href}" style="display:inline-flex;align-items:center;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card-alt);color:var(--text);text-decoration:none;font-size:0.9em;font-weight:700;">${label}</a>`;
}

function authCardHtml(status) {
  if (status.isOwner) {
    const adminLink = status.isAdmin
      ? adminNavLink('/simulator', '🎬 Simulateur') + adminNavLink('/comptes', '🔑 Comptes managers')
      : '';
    // Changer son mdp tant qu'on est connecte -- couvre "je suis encore
    // connecte (session persistee) mais je ne m'en souviens plus" sans
    // passer par l'admin (retour utilisateur 2026-08-13).
    return `
      <div class="auth-card owner">
        <span>🔓 Connecté en tant que ${status.loggedInUserId === userId ? 'toi-même' : status.loggedInUserId}</span>
        ${adminLink}
        <button class="secondary" id="auth-toggle-change-pw">🔑 Changer mon mot de passe</button>
        <button class="secondary" id="auth-logout">Se déconnecter</button>
        <div class="auth-msg" id="auth-msg"></div>
        <div id="auth-change-pw-form" style="display:none; flex-basis:100%; gap:8px; align-items:center;">
          <input type="password" id="auth-new-pw" placeholder="Nouveau mot de passe" autocomplete="new-password">
          <button id="auth-change-pw-submit">Valider</button>
        </div>
      </div>`;
  }
  if (!status.hasPassword) {
    return `
      <div class="auth-card">
        <span>🔒 Pas encore de mot de passe pour ce manager</span>
        <input type="password" id="auth-pw1" placeholder="Choisis un mot de passe" autocomplete="new-password">
        <button id="auth-signup">Créer mon compte</button>
        <div class="auth-msg" id="auth-msg"></div>
      </div>`;
  }
  return `
    <div class="auth-card">
      <span>🔒 Connecte-toi pour gérer tes bonus</span>
      <input type="password" id="auth-pw1" placeholder="Mot de passe" autocomplete="current-password">
      <button id="auth-login">Se connecter</button>
      <div class="auth-msg" id="auth-msg"></div>
    </div>`;
}

async function loadAuthWidget() {
  const el = document.getElementById('auth-widget');
  try {
    const res = await fetch(`/api/auth/status?userId=${encodeURIComponent(userId)}`);
    const status = await res.json();
    isOwner = status.isOwner;
    el.innerHTML = authCardHtml(status);

    const msgEl = document.getElementById('auth-msg');
    const showError = (message) => { if (msgEl) { msgEl.textContent = message; msgEl.className = 'auth-msg err'; } };

    document.getElementById('auth-signup')?.addEventListener('click', async () => {
      const password = document.getElementById('auth-pw1').value;
      const r = await fetch('/api/auth/set-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, password }),
      });
      const data = await r.json();
      if (!r.ok) { showError(data.error || 'Erreur'); return; }
      location.reload();
    });
    document.getElementById('auth-login')?.addEventListener('click', async () => {
      const password = document.getElementById('auth-pw1').value;
      const r = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, password }),
      });
      const data = await r.json();
      if (!r.ok) { showError(data.error || 'Erreur'); return; }
      location.reload();
    });
    document.getElementById('auth-logout')?.addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      location.reload();
    });
    document.getElementById('auth-toggle-change-pw')?.addEventListener('click', () => {
      const form = document.getElementById('auth-change-pw-form');
      form.style.display = form.style.display === 'none' ? 'flex' : 'none';
    });
    document.getElementById('auth-change-pw-submit')?.addEventListener('click', async () => {
      const newPassword = document.getElementById('auth-new-pw').value;
      const r = await fetch('/api/auth/change-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, newPassword }),
      });
      const data = await r.json();
      if (!r.ok) { showError(data.error || 'Erreur'); return; }
      if (msgEl) { msgEl.textContent = '✓ Mot de passe changé.'; msgEl.className = 'auth-msg'; }
      document.getElementById('auth-change-pw-form').style.display = 'none';
    });
  } catch (err) {
    el.innerHTML = `<div class="auth-card"><span class="auth-msg err">Erreur connexion : ${err.message}</span></div>`;
  }
}

const BONUS_OPTIONS = [
  { value: '', label: 'Aucun' },
  { value: 'boostAllPlayers', label: 'Zahia (+0,5 à tous)' },
  { value: 'boostOnePlayer', label: 'McDo+ (+1 à un titu)' },
  { value: 'nerfGoalkeeper', label: 'Suarez (-1 gardien)' },
  { value: 'nerfAllPlayers', label: 'Cheat Code (-0,5 adverses)' },
  { value: 'blockTacticalSubs', label: "Tonton Pat' (bloque tactiques adv.)" },
  { value: 'removeGoal', label: 'Valise à Nanard (annule 1 but adv.)' },
  { value: 'mirror', label: 'Miroir (renvoie/vole le coup adv.)' },
];
// Taille de division MINIMALE a partir de laquelle chaque bonus existe --
// tableau officiel MPG (retour utilisateur 2026-08-11), miroir de
// core.live_scoring.BONUS_MIN_DIVISION_SIZE (garder les deux synchronises).
const BONUS_MIN_DIVISION_SIZE = {
  removeGoal: 4, boostOnePlayer: 4,
  nerfGoalkeeper: 6, boostAllPlayers: 6, mirror: 6,
  nerfAllPlayers: 8, blockTacticalSubs: 8,
};

function bonusOptionsForDivisionSize(divisionSize) {
  return BONUS_OPTIONS.filter(o => !o.value || divisionSize >= (BONUS_MIN_DIVISION_SIZE[o.value] || 0));
}
// Seul boostOnePlayer (McDo+) a besoin d'une cible choisie a la main -- si un
// Miroir vole un McDo+ adverse, la cible se determine automatiquement (meme
// numero de slot dans ma compo que le titulaire vise chez l'adversaire, cf.
// retour utilisateur 2026-08-10), pas de selection manuelle a prevoir ici.
const BONUS_NEEDS_TARGET = new Set(['boostOnePlayer']);

// Etat des simulations en cours, cote navigateur UNIQUEMENT -- jamais envoye
// a un store partage (cf. retour utilisateur 2026-08-10 : un coup non
// confirme ne doit jamais etre visible par l'autre manager). Survit au
// rafraichissement 30s de chargerMatches (sinon la simulation est effacee
// avant qu'on ait le temps de la regarder).
const activeSimulations = {};

// shortId+division seul ne suffit PAS : un manager peut avoir plusieurs
// journees en cours a la fois dans la MEME division (ex. J1 archivee + J2
// live, cf. simulateur) -- sans le gameweek, les deux matchs partageraient
// les memes id DOM dans la popover (score-block-${mid}, data-mid="${mid}"...),
// le deuxieme ecrasant silencieusement le contenu du premier au rendu et
// les listeners de bonus se recablant sur les MEMES elements partages
// (retour utilisateur 2026-08-12 : "mon premier match (le vrai) a disparu").
function matchKey(m) { return `${m.shortId}_${m.division}_gw${m.gameweek}`; }

function optionsHtml(options, selectedValue) {
  return options.map(o => `<option value="${o.value}"${o.value === (selectedValue || '') ? ' selected' : ''}>${o.label}</option>`).join('');
}

function noteClass(note) {
  if (note === null || note === undefined) return 'note-none';
  if (note >= 6) return 'note-high';
  if (note >= 4.5) return 'note-mid';
  return 'note-low';
}

const BONUS_TAG_LABELS = {
  boostAllPlayers: 'Zahia (+0,5)',
  boostOnePlayer: 'McDo+ (+1)',
  nerfGoalkeeper: 'Suarez (-1)',
  nerfAllPlayers: 'Cheat Code (-0,5)',
};
const BOOST_TAGS = new Set(['boostAllPlayers', 'boostOnePlayer']);
const NERF_TAGS = new Set(['nerfGoalkeeper', 'nerfAllPlayers']);

function playerBadge(p, isCaptain) {
  const note = p.effective_note;
  const cls = noteClass(note);
  const noteText = note === null || note === undefined ? '–' : note.toFixed(1).replace(/\.0$/, '');
  const goalFlag = p.but_mpg_bonus ? '<span class="goal-flag"></span>' : '';
  const auraCls = BOOST_TAGS.has(p.bonus_tag) ? ' aura-boost' : NERF_TAGS.has(p.bonus_tag) ? ' aura-nerf' : '';
  const title = p.bonus_tag ? ` title="${BONUS_TAG_LABELS[p.bonus_tag] || p.bonus_tag}"` : '';
  return `<div class="badge ${cls}${auraCls}"${title}>${noteText}${isCaptain ? '<span class="captain-flag">C</span>' : ''}${goalFlag}</div>`;
}

function playersByPosition(team) {
  const groups = { 1: [], 2: [], 3: [], 4: [] };
  Object.entries(team.players || {}).forEach(([playerId, p]) => {
    if (groups[p.position]) groups[p.position].push({ ...p, playerId });
  });
  return groups;
}

function lineAvgText(team, pos) {
  const avg = (team.line_averages || {})[pos];
  return avg === null || avg === undefined ? null : avg.toFixed(1).replace(/\.0$/, '');
}

function positionLabelHtml(pos, homeTeam, awayTeam) {
  const homeAvg = lineAvgText(homeTeam, pos);
  const awayAvg = lineAvgText(awayTeam, pos);
  if (homeAvg === null && awayAvg === null) {
    return `<div class="position-label">${POSITION_LABELS[pos]}</div>`;
  }
  return `
    <div class="position-label line-avg-row">
      <span class="line-avg">${homeAvg ?? ''}</span>
      <span>${POSITION_LABELS[pos]} · moy. ligne</span>
      <span class="line-avg">${awayAvg ?? ''}</span>
    </div>`;
}

function playersHtml(match) {
  const homeGroups = playersByPosition(match.home);
  const awayGroups = playersByPosition(match.away);
  const homeCaptainId = Object.keys(match.home.players || {}).find(id => match.home.players[id].bonus_capitaine > 0);
  const awayCaptainId = Object.keys(match.away.players || {}).find(id => match.away.players[id].bonus_capitaine > 0);

  return [1, 2, 3, 4].map(pos => {
    const homeList = homeGroups[pos];
    const awayList = awayGroups[pos];
    const maxRows = Math.max(homeList.length, awayList.length);
    let rows = '';
    for (let i = 0; i < maxRows; i++) {
      const hp = homeList[i];
      const ap = awayList[i];
      rows += `
        <div class="player-row">
          <div class="player">
            ${hp ? playerBadge(hp, hp.playerId === homeCaptainId) : ''}
            <span class="player-name">${hp ? hp.name : ''}${hp && hp.replaced_starter ? `<span class="replaced-note">↳ remplace ${hp.replaced_starter}</span>` : ''}</span>
          </div>
          <div class="row-sep">·</div>
          <div class="player away">
            ${ap ? playerBadge(ap, ap.playerId === awayCaptainId) : ''}
            <span class="player-name">${ap ? ap.name : ''}${ap && ap.replaced_starter ? `<span class="replaced-note">↳ remplace ${ap.replaced_starter}</span>` : ''}</span>
          </div>
        </div>`;
    }
    return `<div class="position-block">${positionLabelHtml(pos, match.home, match.away)}${rows}</div>`;
  }).join('');
}

function benchBadge(p) {
  // Uniquement des remplacants NON entres (cf. benchBlockHtml) -- toujours
  // "n'a pas joue" ou une note de match non utilisee, jamais de flag "entre".
  const note = p.note_finale;
  const cls = noteClass(note);
  const noteText = note === null || note === undefined ? '–' : note.toFixed(1).replace(/\.0$/, '');
  return `<div class="badge ${cls}">${noteText}</div>`;
}

function benchBlockHtml(home, away) {
  // Un remplacant "entered" occupe deja un slot titulaire (visible dans
  // playersHtml, avec l'annotation "remplace X") -- le montrer aussi ici
  // ferait doublon, cf. retour utilisateur 2026-08-10.
  const homeBench = (home.bench || []).filter(p => !p.entered);
  const awayBench = (away.bench || []).filter(p => !p.entered);
  if (!homeBench.length && !awayBench.length) return '';
  const maxRows = Math.max(homeBench.length, awayBench.length);
  let rows = '';
  for (let i = 0; i < maxRows; i++) {
    const hp = homeBench[i];
    const ap = awayBench[i];
    rows += `
      <div class="player-row">
        <div class="player">
          ${hp ? benchBadge(hp) : ''}
          <span class="player-name">${hp ? hp.name : ''}</span>
        </div>
        <div class="row-sep">·</div>
        <div class="player away">
          ${ap ? benchBadge(ap) : ''}
          <span class="player-name">${ap ? ap.name : ''}</span>
        </div>
      </div>`;
  }
  return `<div class="position-block"><div class="position-label">Remplaçants</div>${rows}</div>`;
}

const OUT_REASON_LABELS = { tactique: 'tactique', obligatoire: 'obligatoire' };

function outBadge(p) {
  const note = p.note_finale;
  const cls = noteClass(note);
  const noteText = note === null || note === undefined ? '–' : note.toFixed(1).replace(/\.0$/, '');
  return `<div class="badge ${cls}">${noteText}</div>`;
}

function outRowHtml(p) {
  if (!p) return { badge: '', name: '' };
  const reason = OUT_REASON_LABELS[p.reason] || p.reason;
  // Retour utilisateur 2026-08-23 : avec une simulation de bonus active
  // (siens McDo+/Zahia OU subis Suarez/Cheat Code), le manager doit voir 2
  // notes distinctes -- celle AVEC le(s) bonus simule(s) (informatif,
  // note_avec_bonus) et celle qui a REELLEMENT determine le remplacement
  // (note_seuil cote serveur, cf. core/live_scoring.py::
  // _note_with_simulated_bonuses -- identique a note_finale si le vrai match
  // de ce titulaire est deja joue, un bonus choisi maintenant n'a alors
  // jamais pu influencer une decision deja reelle). N'affiche rien de plus si
  // aucune des deux ne differe de note_finale (pas de bonus simule, ou sans
  // effet ici).
  const fmt = n => (n === null || n === undefined) ? '–' : n.toFixed(1).replace(/\.0$/, '');
  const bonusDiffers = (p.note_avec_bonus !== undefined && p.note_avec_bonus !== p.note_finale)
    || (p.note_seuil !== undefined && p.note_seuil !== p.note_finale);
  const bonusDetail = bonusDiffers
    ? `<span class="replaced-note">bonus : ${fmt(p.note_avec_bonus)} · seuil retenu : ${fmt(p.note_seuil)}</span>`
    : '';
  return { badge: outBadge(p), name: `${p.name}<span class="replaced-note">→ ${p.replaced_by} (${reason})</span>${bonusDetail}` };
}

function outBlockHtml(home, away) {
  // Titulaires D'ORIGINE reellement sortis (cf. core/live_scoring.py, champ
  // "out") -- categorie a part pour lever l'ambiguite entre "qui joue
  // maintenant" (Titulaires) et "qui a ete remplace" (retour utilisateur
  // 2026-08-10).
  const homeOut = home.out || [];
  const awayOut = away.out || [];
  let rows;
  if (!homeOut.length && !awayOut.length) {
    // Section explicite meme vide -- sinon indiscernable d'une fonctionnalite
    // cassee (retour utilisateur 2026-08-10 : "je ne le vois nulle part").
    // Aucun remplacement resolu = normal en debut/milieu de journee, MPG ne
    // fige les subs tactiques/obligatoires qu'une fois les stats finales
    // connues.
    rows = '<div class="no-scorer" style="text-align: center; padding: 4px 0;">Aucun remplacement effectif pour l\'instant</div>';
  } else {
    const maxRows = Math.max(homeOut.length, awayOut.length);
    rows = '';
    for (let i = 0; i < maxRows; i++) {
      const hp = outRowHtml(homeOut[i]);
      const ap = outRowHtml(awayOut[i]);
      rows += `
        <div class="player-row">
          <div class="player">
            ${hp.badge}
            <span class="player-name">${hp.name}</span>
          </div>
          <div class="row-sep">·</div>
          <div class="player away">
            ${ap.badge}
            <span class="player-name">${ap.name}</span>
          </div>
        </div>`;
    }
  }
  return `<div class="position-block"><div class="position-label">Joueurs sortis</div>${rows}</div>`;
}

function eventDateLabel(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
}

function scorersHtml(team) {
  if (!team.goal_events || team.goal_events.length === 0) {
    return '<div class="no-scorer">—</div>';
  }
  const sorted = [...team.goal_events].sort((a, b) => {
    if (a.date && b.date && a.date !== b.date) return a.date < b.date ? -1 : 1;
    const ta = a.time ? parseInt(a.time) : 999;
    const tb = b.time ? parseInt(b.time) : 999;
    return ta - tb;
  });
  return sorted.map(ev => `
    <div class="scorer-row">
      <span class="ball ${ev.type}"></span>
      <span>${ev.name}</span>
      ${(ev.time || ev.date) ? `<span class="scorer-time">${ev.time || ''}${ev.date ? ` · ${eventDateLabel(ev.date)}` : ''}</span>` : ''}
    </div>`).join('');
}

// Nom d'equipe cliquable dans le detail d'un match -- amene sur la page du
// manager concerne (retour utilisateur 2026-08-17 : "quand on clique sur le
// nom d'un Manager depuis le detail d'un match on devrait pouvoir arriver
// sur sa page"). Navigation reelle (pas une modale in-page) : c'est bien SA
// page complete qu'on demande, pas un apercu.
function teamNameLinkHtml(team) {
  const label = team.realName || team.userId || '';
  const sub = `<span class="sub-team">${team.teamName || ''}</span>`;
  if (!team.userId) return `<div class="team-name">${label}${sub}</div>`;
  return `<a class="team-name" href="/manager?id=${encodeURIComponent(team.userId)}">${label}${sub}</a>`;
}

function scoreBlockHtml(home, away, unreliable) {
  // Le detail buteurs vient du "duel de lignes" calcule SANS bonus applique
  // -- si le score officiel archive ne correspond pas a ce qu'on a calcule
  // (un bonus reellement joue a change l'issue, invisible pour nous), le
  // detail buteur/notes ci-dessous ne correspond plus au score officiel
  // affiche. Mieux vaut le dire clairement que montrer un detail incoherent
  // avec son propre score (retour utilisateur 2026-08-11 : score 2-3 affiche
  // mais 3 buteurs domicile listes).
  const caveat = unreliable ? `
    <div class="scorer-caveat">⚠️ Score officiel final ci-dessus — un bonus joué en direct (invisible pendant le match) a changé l'issue, donc le détail buteurs/notes qui suit ne correspond plus exactement à ce score.</div>` : '';
  return `
    <div class="score-row">
      ${teamNameLinkHtml(home)}
      <div class="score"><span class="side">${home.score}</span> - <span class="side">${away.score}</span></div>
      ${teamNameLinkHtml(away)}
    </div>
    ${caveat}
    <div class="scorers">
      <div class="scorers-col home">${scorersHtml(home)}</div>
      <div class="scorers-col away">${scorersHtml(away)}</div>
    </div>`;
}

function targetSelectHtml(mid, ownTeam, selectedId, hidden) {
  const players = Object.entries(ownTeam.players || {}).map(([id, p]) => ({ id, name: p.name }));
  const targetOptionsHtml = list => list.map(p => `<option value="${p.id}"${p.id === selectedId ? ' selected' : ''}>${p.name}</option>`).join('');
  // Titulaires deja remplaces mais dont le VRAI match n'a pas encore demarre
  // (note par defaut, is_default_rating cote serveur -- cf.
  // resolve_starting_lineup::out/compute_player_live_score) restent
  // choisissables ici -- retour utilisateur 2026-08-23 : on NE CHANGE PAS la
  // logique de remplacement provisoire, mais la simulation doit rester
  // complete (pouvoir tester "et si j'avais mis McDo+ sur LUI", meme deja
  // sorti provisoirement -- ca peut annuler le remplacement, cf.
  // resolve_starting_lineup cote serveur). EXCLUT en revanche les titulaires
  // dont le vrai match est deja joue/termine (retour utilisateur 2026-08-23,
  // 2e passage : "les managers peuvent croire qu'ils sont en droit de mettre
  // un bonus meme aux joueurs ayant deja joue" -- leur remplacement est deja
  // reel/confirme, aucun bonus choisi maintenant ne peut plus rien changer).
  const outPlayers = (ownTeam.out || [])
    .filter(p => p.is_default_rating)
    .map(p => ({ id: p.playerId, name: p.name }));
  const outGroup = outPlayers.length
    ? `<optgroup label="Joueurs dont l'équipe n'a pas joué">${targetOptionsHtml(outPlayers)}</optgroup>`
    : '';
  return `<select class="bonus-select own-target-select" data-mid="${mid}" style="${hidden ? 'display:none' : ''}"><option value="">— choisir le titu —</option>${targetOptionsHtml(players)}${outGroup}</select>`;
}

function matchHomeAway(m) {
  // Vraie position MPG (jamais "moi toujours a gauche") -- cf. retour
  // utilisateur 2026-08-10 : une position domicile fausse induit en erreur
  // sur le tie-break du duel de lignes pour qui regarde.
  return m.isHome ? { home: m.team, away: m.opponent } : { home: m.opponent, away: m.team };
}

// Bouton compact d'une ligne dans la colonne de sa ligue (retour utilisateur
// 2026-08-16 : anticiper les 192 matchs/saison -- le detail complet ne se
// charge plus qu'au clic, dans la popover, cf. matchDetailHtml/openMatchModal.
// Le point rouge anime signale la journee EN COURS (matchs pas encore
// archives) -- "Termine" sinon.
function matchButtonHtml(m) {
  const mid = matchKey(m);
  // Si "Mon Bonus" est actif sur CE match (dernier calcul mis en cache par
  // runScenario, cf. sa docstring), la tuile suit la MEME simulation que le
  // classement (classementSimSource) plutot que d'afficher le score reel
  // brut -- sinon la page se contredit elle-meme (retour utilisateur
  // 2026-08-17, cf. .is-simulated ci-dessus).
  const sim = activeSimulations[mid];
  const simulating = !!(sim && sim.ownBonus && sim.preview);
  const { home, away } = simulating ? sim.preview : matchHomeAway(m);
  return `
    <button type="button" class="match-btn${m.archived ? '' : ' is-live'}${simulating ? ' is-simulated' : ''}" data-mid="${mid}">
      <span class="match-btn-meta">D${m.division} · J${m.gameweek}${m.archived ? ' <span class="archived-badge">Terminé</span>' : ' <span class="live-dot"></span>'}${simulating ? ' <span class="sim-badge" title="Score simulé avec Mon Bonus — jamais enregistré, invisible par l’adversaire">🔮</span>' : ''}</span>

async function chargerDivisionClassement(m, el) {
  try {
    const mid = matchKey(m);

    const params = new URLSearchParams({
      shortId: m.shortId, season: m.season, gameweek: m.gameweek, division: m.division,
    });
    // Reflete la simulation "Mon Bonus" active sur CE match, meme principe
    // que la carte "Super Classement" (classementSimSource) -- sans ca, le
    // classement de division restait sur le reel alors que le plateau/score
    // affichaient deja le resultat simule (retour utilisateur : incoherent).
    if (sim.ownBonus) {
      params.set('userId', userId);
      params.set('ownBonus', sim.ownBonus);
      if (sim.targetPlayerId) params.set('targetPlayerId', sim.targetPlayerId);
    }
    const res = await fetch(`/api/division-classement?${params.toString()}`);

      el.innerHTML = '<span class="status-msg">Classement indisponible pour cette division.</span>';

      <table class="div-classement-table">

  } catch (err) {
    el.innerHTML = `<span class="status-msg err">Erreur : ${err.message}</span>`;
  }
}

// Reflete immediatement le score simule (ou son retrait) sur la tuile de la
// grille, sans attendre le prochain poll -- cf. matchButtonHtml/runScenario
// (retour utilisateur 2026-08-17).

  if (btn) btn.outerHTML = matchButtonHtml(m);

// Compteur de generation par match, incremente a CHAQUE appel de runScenario
// -- garde-fou contre les reponses qui arrivent dans le desordre (retour
// utilisateur 2026-08-17 : "le calcul du bonus ne se fait pas au premier
// essai, je dois fermer le popover et le relancer"). Cause reelle : choisir
// "Mon Bonus" PUIS sa cible (McDo+) declenche 2 fetches /api/live-scenario
// quasi coup sur coup (un sans cible, un avec) -- si le PREMIER (sans cible,
// donc SANS effet, cf. apply_own_bonus_effect cote serveur qui exige
// target_player_id in players) repond APRES le second, il ecrasait le bon
// resultat avec le mauvais. Chaque appel capture son propre numero de
// generation ; si un appel PLUS RECENT a deja demarre au moment ou la
// reponse arrive, elle est jetee au lieu d'ecraser le DOM.
const scenarioGeneration = {};

async function runScenario(m, resultEl) {
  // Previsualise UNIQUEMENT mon propre bonus sur le plateau (aura, note,
  // score) -- l'exploration des bonus adverses se fait a part, via
  // runSweep (etat des lieux de tous les cas de figure a la fois).
  const mid = matchKey(m);
  // Un seul match a la fois est affiche (dans la popover, cf. openMatchModal
  // -- avant le passage aux colonnes/popover, chaque match avait sa propre
  // carte #card-${mid} ; desormais .modal-box est la SEULE carte visible,
  // inutile de la cibler par mid).
  const card = document.querySelector('.modal-box');
  const sim = activeSimulations[mid] || {};
  const ownBonus = sim.ownBonus || '';
  const targetPlayerId = BONUS_NEEDS_TARGET.has(ownBonus) ? (sim.targetPlayerId || '') : '';

  const generation = (scenarioGeneration[mid] = (scenarioGeneration[mid] || 0) + 1);

  if (!ownBonus) {
    resultEl.textContent = '';
    resultEl.className = 'scenario-result';
    const { home, away } = matchHomeAway(m);
    swapMatchBlocks(mid, home, away);
    card.classList.remove('scenario-active');
    refreshMatchTile(m);
    return;
  }

  resultEl.textContent = 'Calcul…';
  resultEl.className = 'scenario-result';
  try {
    const params = new URLSearchParams({
      shortId: m.shortId, season: m.season, division: m.division, gameweek: m.gameweek, userId, ownBonus,
    });
    if (targetPlayerId) params.set('targetPlayerId', targetPlayerId);

    const res = await fetch(`/api/live-scenario?${params.toString()}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    if (scenarioGeneration[mid] !== generation) return;  // reponse perimee, cf. docstring ci-dessus.
    // IMPORTANT : on affiche data.home/data.away tels quels -- vraie position
    // domicile/exterieur MPG, jamais reordonnee vers "moi a gauche" (le
    // tie-break du duel de lignes depend de cette position reelle, la
    // deformer pour l'affichage induirait en erreur, cf. retour utilisateur
    // 2026-08-10 : "il faut garder les donnees de MPG").
    swapMatchBlocks(mid, data.home, data.away);
    card.classList.add('scenario-active');
    resultEl.textContent = `🔮 Simulation (moi : ${BONUS_TAG_LABELS[ownBonus] || ownBonus}) — jamais enregistrée, invisible par l'adversaire.`;
    // McDo+ sur un titulaire deja remplace (cf. targetSelectHtml, optgroup
    // "Deja remplaces") : le bonus ne trouve personne a booster cote serveur
    // (apply_own_bonus_effect n'agit que sur "players", jamais "out") -- le
    // total simule reste donc identique a sans bonus. Averti explicitement
    // ici plutot que de laisser le manager croire, a tort, que son choix a
    // compte (retour utilisateur 2026-08-23).
    if (ownBonus === 'boostOnePlayer' && targetPlayerId) {
      const ownSide = m.isHome ? data.home : data.away;
      const landed = Object.values(ownSide.players || {}).some(p => p.bonus_tag === 'boostOnePlayer');
      if (!landed) {
        resultEl.textContent += ' ⚠️ Ce joueur est déjà remplacé (provisoire) — le bonus n’a aucun effet sur le total tant que ça reste le cas.';
      }
    }
    // Cache pour matchButtonHtml -- la tuile de la grille doit refleter le
    // MEME score simule que la popover et le classement (classementSimSource),
    // sinon la page se contredit (retour utilisateur 2026-08-17 : classement
    // a #10 avec la simulation active, tuile toujours a 2-2).
    if (activeSimulations[mid]) activeSimulations[mid].preview = { home: data.home, away: data.away };
    refreshMatchTile(m);
  } catch (err) {
    if (scenarioGeneration[mid] !== generation) return;  // reponse perimee, cf. docstring ci-dessus.
    resultEl.textContent = `Erreur : ${err.message}`;
    resultEl.className = 'scenario-result err';
  }
}

function swingClass(row) {
  const swing = row.deltaMine - row.deltaTheirs;
  if (swing < 0) return 'bad';
  if (swing === 0) return 'neutral';
  return '';
}

function swingText(row) {
  const swing = row.deltaMine - row.deltaTheirs;
  if (swing === 0) return '=';
  return swing > 0 ? `+${swing}` : `${swing}`;
}

function classifyResult(myScore, theirScore) {
  if (myScore > theirScore) return 'win';
  if (myScore < theirScore) return 'loss';
  return 'draw';
}

function computeOutcomeOdds(data) {
  // 1 poids par TYPE de bonus adverse (pas par ligne du tableau), pour ne pas
  // faire peser McDo+ ~10x plus que Zahia (autant de lignes que de cibles
  // possibles). Mais un type a plusieurs lignes ne vote pas "tout ou rien" --
  // son poids (1) est REPARTI proportionnellement entre victoire/nul/defaite
  // selon la distribution reelle de ses lignes (retour utilisateur
  // 2026-08-10 : "si un mcdo est inoffensif [...] on augmente le pourcentage
  // de victoire, si match nul ou defaite on place dans le pool approprie") --
  // un McDo+ qui ne menace que 2 cibles sur 10 ne doit pas compter comme une
  // defaite certaine.
  const rowsByType = {};
  for (const s of data.scenarios) {
    (rowsByType[s.opponentBonus] ||= []).push(s);
  }

  const weights = { win: 0, draw: 0, loss: 0 };
  weights[classifyResult(data.baseline.myScore, data.baseline.theirScore)] += 1;

  let typeCount = 1; // la baseline compte comme 1 "type" (aucun bonus adverse).
  Object.values(rowsByType).forEach(rows => {
    typeCount += 1;
    const share = 1 / rows.length;
    rows.forEach(r => { weights[classifyResult(r.myScore, r.theirScore)] += share; });
  });

  return {
    win: Math.round((weights.win / typeCount) * 100),
    draw: Math.round((weights.draw / typeCount) * 100),
    loss: Math.round((weights.loss / typeCount) * 100),
    total: typeCount,
  };
}

function oddsBarHtml(data) {
  const odds = computeOutcomeOdds(data);
  const segHtml = (cls, pct) => pct > 0 ? `<div class="odds-seg ${cls}" style="flex:${pct}">${pct}%</div>` : '';
  return `
    <div class="odds-title">Chances de résultat (à l'instant T)</div>
    <div class="odds-bar">
      ${segHtml('win', odds.win)}
      ${segHtml('draw', odds.draw)}
      ${segHtml('loss', odds.loss)}
    </div>
    <div class="odds-caption">Victoire ${odds.win}% · Nul ${odds.draw}% · Défaite ${odds.loss}% — état actuel + 1 poids par type de bonus adverse possible (${odds.total} au total) ; pour McDo+, le poids est réparti selon la part de cibles qui changent vraiment le résultat.</div>`;
}

function sweepTableHtml(data, isHome) {
  // Meme convention que le tableau de score principal : domicile a gauche,
  // exterieur a droite -- jamais "moi/eux" dans un ordre fixe, qui contredit
  // visuellement la position reelle affichee juste au-dessus (retour
  // utilisateur 2026-08-10).
  const rows = data.scenarios.map(s => {
    const homeScore = isHome ? s.myScore : s.theirScore;
    const awayScore = isHome ? s.theirScore : s.myScore;
    return `
    <tr>
      <td class="sweep-label" title="${s.label}">${s.label}</td>
      <td class="sweep-score">${homeScore}</td>
      <td class="sweep-score">${awayScore}</td>
      <td class="sweep-swing ${swingClass(s)}">${swingText(s)}</td>
    </tr>`;
  }).join('');
  const baseHome = isHome ? data.baseline.myScore : data.baseline.theirScore;
  const baseAway = isHome ? data.baseline.theirScore : data.baseline.myScore;
  return `
    ${oddsBarHtml(data)}
    <div class="sweep-scroll">
      <table class="sweep-table">
        <thead>
          <tr class="sweep-head">
            <td></td><td class="sweep-score">Domicile</td><td class="sweep-score">Extérieur</td><td class="sweep-swing">Δ</td>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="scenario-result">Base (avec mon bonus) : domicile ${baseHome} — extérieur ${baseAway} · Δ = évolution de la différence de buts EN MA FAVEUR si l'adversaire joue ce bonus (négatif = mauvais pour moi).</div>`;
}

// Meme garde-fou que scenarioGeneration (cf. runScenario) -- runSweep est
// declenche par le meme trigger() a chaque changement de menu, donc
// susceptible de la meme reponse hors-ordre.
const sweepGeneration = {};

async function runSweep(m, sweepEl) {
  const mid = matchKey(m);
  const sim = activeSimulations[mid] || {};
  const ownBonus = sim.ownBonus || '';
  const targetPlayerId = BONUS_NEEDS_TARGET.has(ownBonus) ? (sim.targetPlayerId || '') : '';
  const generation = (sweepGeneration[mid] = (sweepGeneration[mid] || 0) + 1);

  sweepEl.innerHTML = '<span class="status-msg">Analyse en cours…</span>';
  try {
    const params = new URLSearchParams({
      shortId: m.shortId, season: m.season, division: m.division, gameweek: m.gameweek, userId,
    });
    if (ownBonus) params.set('ownBonus', ownBonus);
    if (targetPlayerId) params.set('targetPlayerId', targetPlayerId);

    const res = await fetch(`/api/live-scenario-sweep?${params.toString()}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    if (sweepGeneration[mid] !== generation) return;  // reponse perimee, cf. scenarioGeneration.
    sweepEl.innerHTML = sweepTableHtml(data, m.isHome);
  } catch (err) {
    if (sweepGeneration[mid] !== generation) return;
    sweepEl.innerHTML = `<span class="status-msg err">Erreur : ${err.message}</span>`;
  }
}

// Signature (score + notes des 2 equipes) du dernier tableau "Bonus Adverse"
// calcule pour un match -- ne relance runSweep au rafraichissement 30s QUE si
// le score ou une note a reellement change depuis (retour utilisateur
// 2026-08-10 : ni un timer aveugle -- ca clignote pour rien -- ni figer une
// bonne fois pour toutes -- un but ou une note qui change doit se refleter).
// Reste aussi declenche instantanement des que l'utilisateur touche un menu
// (cf. trigger()), independamment de la signature.
const lastSweepSignature = new Map();

function matchSignature(m) {
  const notes = [
    ...Object.entries(m.team.players || {}).map(([id, p]) => `${id}:${p.effective_note}`),
    ...Object.entries(m.opponent.players || {}).map(([id, p]) => `${id}:${p.effective_note}`),
  ];
  return `${m.team.score}-${m.opponent.score}|${notes.sort().join(',')}`;
}

function attachBonusControls(container, matches) {
  matches.forEach((m) => {
    const mid = matchKey(m);
    const divClassementEl = container.querySelector(`#div-classement-${mid}`);
    const ownSelect = container.querySelector(`.sim-own-select[data-mid="${mid}"]`);
    // Le classement de division reste consultable meme sur un match archive
    // OU quand on n'est pas connecte (retour utilisateur 2026-08-11 : "ça
    // n'empêche pas l'affichage du classement de la division" ; retour
    // 2026-08-14 : "si je ne suis pas connecté, je n'arrive pas à avoir
    // accès au classement provisoire de ma poule/division"). Dans les deux
    // cas .sim-own-select est absent du DOM (bonusControlsHtml omis, cf.
    // matchDetailHtml) -- charge ici, AVANT le "return" ci-dessous qui ne doit
    // couper court que sur le cablage des controles de simulation
    // eux-memes, jamais sur ce chargement.
    if (!ownSelect && divClassementEl) {
      const signature = matchSignature(m);
      if (lastSweepSignature.get(mid) !== signature) {
        lastSweepSignature.set(mid, signature);
        chargerDivisionClassement(m, divClassementEl);
      }
    }

    const targetSelect = container.querySelector(`.own-target-select[data-mid="${mid}"]`);
    const resultEl = container.querySelector(`#scenario-result-${mid}`);
    const sweepEl = container.querySelector(`#sweep-${mid}`);
    if (!ownSelect) return;

    const trigger = () => {
      const ownBonus = ownSelect.value || '';
      activeSimulations[mid] = {
        ownBonus,
        targetPlayerId: targetSelect.value || '',
      };
      runScenario(m, resultEl);
      lastSweepSignature.set(mid, matchSignature(m));
      runSweep(m, sweepEl);
      if (divClassementEl) chargerDivisionClassement(m, divClassementEl);

      // Le classement provisoire suit le dernier "Mon Bonus" touche -- repasse
      // en reel si on revient a "Aucun" sur le match qui le pilotait.
      if (ownBonus) {
        classementSimSource = m;
        chargerClassement();
      } else if (classementSimSource && matchKey(classementSimSource) === mid) {
        classementSimSource = null;
        chargerClassement();
      }
    };

    ownSelect.addEventListener('change', () => {
      targetSelect.style.display = BONUS_NEEDS_TARGET.has(ownSelect.value) ? 'block' : 'none';
      trigger();
    });
    targetSelect.addEventListener('change', trigger);

    // Previsualisation "Mon Bonus" : se remet a jour a chaque rendu (garde le
    // plateau live si une simulation est active). Le tableau adverse ne se
    // relance que si le score/les notes ont change depuis le dernier calcul.
    runScenario(m, resultEl);
    const signature = matchSignature(m);
    if (lastSweepSignature.get(mid) !== signature) {
      lastSweepSignature.set(mid, signature);
      runSweep(m, sweepEl);
      if (divClassementEl) chargerDivisionClassement(m, divClassementEl);
      // Ce match pilote le classement simule et ses notes ont change --
      // garde le classement a jour (chargerMatches n'appelle ce bloc que si
      // quelque chose a reellement bouge, cf. sa propre signature globale).
      if (classementSimSource && matchKey(classementSimSource) === mid) {
        chargerClassement();
      }
    }
  });
}

// Toutes les ligues connues (retour utilisateur 2026-08-16, "6 colonnes, le
// nom de chaque championnat dans l'en-tête") -- chargees une fois, sert a
// TOUJOURS afficher les 6 colonnes meme si ce manager n'a encore aucun match
// dans l'une d'elles (saison pas commencee dans cette ligue).
let allLeagues = [];
// Onglet actif sur mobile (une ligue affichee a la fois, cf. media query
// @900px) -- auto-choisi au premier rendu (priorite a une ligue avec un
// match EN COURS), garde ensuite la main de l'utilisateur.
let activeLeagueCode = null;
// mid -> match du dernier rendu, pour retrouver le detail complet au clic
// sur un bouton compact (cf. matchButtonHtml) sans le re-demander au serveur.
let matchesByMid = {};
// mid du match dont la popover est actuellement ouverte, null si fermee --
// permet de la garder a jour au fil des polls (cf. chargerMatches) sans la
// refermer sous les yeux de l'utilisateur.
let openMatchMid = null;

async function loadLeagues() {
  const res = await fetch('/api/leagues');
  const data = await res.json();
  allLeagues = data.leagues || [];
}

function renderLeagueTabs() {
  document.getElementById('league-tabs').innerHTML = allLeagues.map(l => `
    <button type="button" data-code="${l.code}" class="${l.code === activeLeagueCode ? 'active' : ''}">${l.nom}</button>
  `).join('');

function renderMatchModalBody(m) {
  document.getElementById('modal-match-title').textContent = `${m.ligueNom} · Division ${m.division} · J${m.gameweek}`;
  const body = document.getElementById('match-modal-body');
  body.innerHTML = matchDetailHtml(m);
  // body.innerHTML detruit #sweep-${mid}/#div-classement-${mid} et en recree
  // des NEUFS (figes sur "Analyse en cours..."/"Chargement..." tant que rien
  // ne les repeuple) -- lastSweepSignature suit la fraicheur des DONNEES, pas
  // celle du DOM, donc si la signature de CE match precis n'a pas change
  // (meme si le rendu a ete redeclenche par un AUTRE match de la meme
  // reponse /api/live-manager), attachBonusControls sautait le recalcul et
  // laissait les nouveaux elements vides pour de bon -- le resultat d'un
  // appel precedent avait bien ete ecrit, mais dans l'ancien element deja
  // detruit (retour utilisateur 2026-08-17 : "plus d'une minute et les
  // scenarios ne s'affichent pas"). Purger l'entree force
  // attachBonusControls a repeupler les elements FRAICHEMENT crees, qu'ils
  // aient ou non de nouvelles donnees a afficher.
  lastSweepSignature.delete(matchKey(m));
  attachBonusControls(body, [m]);
}

function openMatchModal(m) {
  openMatchMid = matchKey(m);
  renderMatchModalBody(m);
  document.getElementById('match-modal').classList.remove('hidden');
}

function closeMatchModal() {
  document.getElementById('match-modal').classList.add('hidden');
  openMatchMid = null;
}

document.getElementById('leagues-grid').addEventListener('click', (e) => {
  const btn = e.target.closest('.match-btn');
  if (!btn) return;
  const m = matchesByMid[btn.dataset.mid];
  if (m) openMatchModal(m);
});
document.getElementById('match-modal-close').addEventListener('click', closeMatchModal);
document.getElementById('match-modal').addEventListener('click', (e) => {
  if (e.target.id === 'match-modal') closeMatchModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeMatchModal();
});

// Signature globale (tous les matchs confondus) du dernier rendu -- si rien
// n'a bouge (aucun match reellement en cours, ou notes/score identiques),
// on ne touche PAS au DOM du tout au poll suivant : pas de reconstruction,
// pas de re-declenchement du tableau "Bonus Adverse", rien (retour
// utilisateur 2026-08-10 : "on est en mode live mais aucun match ne tourne,
// les notes n'evoluent donc pas -- ne refaire un calcul que si elles ont
// change").
let lastMatchesSignature = null;

async function chargerMatches() {
  const grid = document.getElementById('leagues-grid');
  try {
    const res = await fetch(`/api/live-manager?userId=${encodeURIComponent(userId)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    const matches = data.matches;

    const overallSignature = matches.map(m => `${matchKey(m)}:${matchSignature(m)}`).join('|');
    if (overallSignature === lastMatchesSignature) {
      return;  // rien n'a change depuis le dernier poll -- DOM intact, aucun recalcul.
    }
    lastMatchesSignature = overallSignature;

    matchesByMid = {};
    matches.forEach(m => { matchesByMid[matchKey(m)] = m; });

    const byLeague = new Map();
    matches.forEach(m => {
      if (!byLeague.has(m.shortId)) byLeague.set(m.shortId, []);
      byLeague.get(m.shortId).push(m);
    });
    // Le plus recent en tete (la journee EN COURS, s'il y en a une, remonte
    // naturellement en haut de sa colonne -- retour utilisateur 2026-08-16 :
    // "indiquer visuellement la journée en Live", cf. aussi le point rouge
    // anime sur matchButtonHtml).
    byLeague.forEach(list => list.sort((a, b) => b.gameweek - a.gameweek));

    if (!activeLeagueCode || !allLeagues.some(l => l.code === activeLeagueCode)) {
      const withLive = allLeagues.find(l => (byLeague.get(l.code) || []).some(m => !m.archived));
      const withAny = allLeagues.find(l => (byLeague.get(l.code) || []).length);
      activeLeagueCode = (withLive || withAny || allLeagues[0] || {}).code || null;
    }

    grid.innerHTML = allLeagues.map(l => {
      const leagueMatches = byLeague.get(l.code) || [];
      const matchesHtml = leagueMatches.length
        ? leagueMatches.map(matchButtonHtml).join('')
        : '<span class="status-msg">Aucun match.</span>';
      return `
        <div class="league-column${l.code === activeLeagueCode ? ' active-tab' : ''}" data-code="${l.code}">
          <div class="league-column-header">${l.nom}</div>
          <div class="league-matches">${matchesHtml}</div>
        </div>`;
    }).join('');
    renderLeagueTabs();

    // Popover ouverte -> la rafraichit avec les donnees fraiches du meme
    // match plutot que de la laisser figee ou de la refermer sous les yeux
    // de l'utilisateur (meme principe que l'ancien "rien ne se referme au
    // poll suivant", simplifie : plus qu'UN element a garder a jour au lieu
    // de potentiellement N cartes + leurs sous-expanders, cf. commit
    // precedent "poupées russes").
    if (openMatchMid && matchesByMid[openMatchMid]) {
      renderMatchModalBody(matchesByMid[openMatchMid]);
    }
  } catch (err) {
    grid.innerHTML = `<span class="status-msg err">Erreur : ${err.message}</span>`;
  }
}

function bonusPillsHtml(bonuses) {
  const entries = Object.entries(bonuses || {}).filter(([, v]) => v);
  if (!entries.length) return '';
  // Certains bonus sont des malus (ex. Grotaldo, King Grotaldo : deja
  // negatifs) -- ne prefixer de "+" que les valeurs positives, sinon "+-10"
  // (retour utilisateur 2026-08-16, remarque a l'occasion de l'ajout de
  // Grotaldo aux compteurs de match affiches ici).
  return `<div class="bonus-grid">${entries.map(([k, v]) =>
    `<span class="bonus-pill">${k.replace(/_/g, ' ')} <span class="v">${v >= 0 ? '+' : ''}${v}</span></span>`
  ).join('')}</div>`;
}

// Quel match pilote actuellement le classement provisoire avec sa simulation
// "Mon Bonus" (un seul a la fois -- le dernier touche). null = classement reel,
// sans simulation (retour utilisateur 2026-08-11 : le classement doit refleter
// la simulation active, pas seulement l'etat officiel).
let classementSimSource = null;

async function chargerClassement() {
  const el = document.getElementById('classement');
  const simMatch = classementSimSource;
  const sim = simMatch ? (activeSimulations[matchKey(simMatch)] || {}) : null;

  try {
    const params = new URLSearchParams({ userId });
    if (simMatch && sim && sim.ownBonus) {
      params.set('shortId', simMatch.shortId);
      params.set('season', simMatch.season);
      params.set('division', simMatch.division);
      params.set('gameweek', simMatch.gameweek);
      params.set('ownBonus', sim.ownBonus);
      if (sim.targetPlayerId) params.set('targetPlayerId', sim.targetPlayerId);
    }

    const res = await fetch(`/api/manager-classement?${params.toString()}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    if (!data.found) {
      el.innerHTML = `<span class="status-msg">${data.reason || 'Pas de classement disponible.'}</span>`;
      return;
    }
    // Detail par ligue clarifie -- avant, "2.7 pts" s'affichait sans dire de
    // quoi il s'agissait (points pondérés V/N/D SEULS, pas le total), et les
    // badges de bonus internes en dessous n'etaient relies par aucun calcul
    // visible -- retour utilisateur 2026-08-13 : "mieux vaudrait clairement
    // expliquer les points". Les 3 chiffres (base + bonus internes = sous-
    // total) sont maintenant explicites, et relies au total du Super
    // Classement ci-dessus (qui ajoute encore les bonus generaux).
    const pointsPondSum = data.leagues.reduce((s, l) => s + (l.points || 0), 0);
    const internalBonusSum = Object.values(data.internalBonuses || {}).reduce((s, v) => s + (v || 0), 0);
    // cleanSheet/manita/on_fire/Grotaldo comptent AUSSI dans le total officiel
    // (cf. update_team_points, cellules 17-18 du notebook) mais restaient
    // absents d'ici -- retour utilisateur 2026-08-16 : "math isn't mathing",
    // le sous-total ne pouvait jamais retomber juste sans eux.
    const matchCounterSum = Object.values(data.matchCounters || {}).reduce((s, v) => s + (v || 0), 0);
    const leagueSubtotal = Math.round((pointsPondSum + internalBonusSum + matchCounterSum) * 100) / 100;

    const leaguesHtml = data.leagues.map(l => `
      <div class="league-row">
        <span>${l.league}</span>
        <span><span class="place">#${l.place}</span> <span class="points">${l.points ?? ''} pts</span></span>
      </div>`).join('') || '<span class="status-msg">Aucune ligue avec données.</span>';

    const simNote = data.simulated
      ? `<div class="scenario-result">🔮 Simulé avec "Mon Bonus" (${simMatch.ligueNom}) — jamais enregistré, invisible par l'adversaire.</div>`
      : '';

    el.innerHTML = `
      <div class="card${data.simulated ? ' scenario-active' : ''}">
        <div class="card-title">🏆 Super Classement (toutes ligues confondues)</div>
        <div class="rank-row">
          <span class="rank-value">#${data.rank}</span>
          <span class="rank-label">sur ${data.totalEntries} · ${data.totalPoints} pts</span>
        </div>
        ${simNote}
        <div class="points-explain">= points de ligue(s) ci-dessous + bonus généraux (Winner, Gollum…) juste en dessous</div>
        ${bonusPillsHtml(data.generalBonusDetails)}
        <div class="caveat">${data.caveat || ''}</div>
      </div>
      <div class="card">
        <div class="card-title">Détail par ligue</div>
        <div class="points-explain">Points pondérés (base V/N/D, avant tout bonus) :</div>
        ${leaguesHtml}
        <div class="points-explain">+ Bonus internes (Pichichi, Le Mur, Champion, Podium, Précieux) :</div>
        ${bonusPillsHtml(data.internalBonuses)}
        <div class="points-explain">+ Clean sheets, manitas, buts "en feu" et Grotaldo (malus) :</div>
        ${bonusPillsHtml(data.matchCounters) || '<span class="status-msg" style="margin-top:0">Aucun.</span>'}
        <div class="league-row subtotal">
          <span>= Sous-total ligue(s)</span>
          <span class="points">${leagueSubtotal} pts</span>
        </div>
        ${(data.otherBonuses && Object.keys(data.otherBonuses).length) ? `
        <div class="points-explain">Autres titres (Boss Saison) — informatif, ne compte pas dans le total :</div>
        ${bonusPillsHtml(data.otherBonuses)}` : ''}
      </div>`;
  } catch (err) {
    el.innerHTML = `<span class="status-msg err">Erreur : ${err.message}</span>`;
  }
}

async function chargerHeader() {
  try {
    const res = await fetch('/api/managers');
    const data = await res.json();
    // MarkerColour personnel de chaque manager, repere visuel par ligne dans
    // les tableaux de classement (retour utilisateur 2026-08-13) -- reutilise
    // ce meme fetch (deja fait pour l'en-tete) plutot qu'un appel dedie.
    (data.managers || []).forEach(m => {
      if (m.userId && m.markerColour) colorByUserId[m.userId] = m.markerColour;
    });
    const manager = (data.managers || []).find(m => m.userId === userId);
    document.getElementById('manager-name').textContent = manager ? manager.realName : userId;
    document.title = `MPG — ${manager ? manager.realName : userId}`;
    if (manager && manager.avatarUrl) {
      const avatar = document.getElementById('avatar');
      avatar.src = manager.avatarUrl;
      avatar.style.display = 'block';
    }
    if (manager && manager.markerColour) {
      document.documentElement.style.setProperty('--accent', manager.markerColour);
    }
    if (manager && manager.blasonUrl) {
      const blason = document.getElementById('blason');
      blason.onerror = () => { blason.style.display = 'none'; }; // pas tous les managers n'ont un blason
      blason.src = manager.blasonUrl;
      blason.style.display = 'block';
    }
  } catch (err) {
    document.getElementById('manager-name').textContent = userId || '?';
  }
}

if (!userId) {
  document.getElementById('leagues-grid').innerHTML = '<span class="status-msg err">Aucun manager sélectionné.</span>';
  document.getElementById('classement').innerHTML = '';
} else {
  chargerHeader().then(() => {
    loadAuthWidget().then(() => {
      chargerClassement();
      loadLeagues().then(chargerMatches);
      setInterval(chargerMatches, 60000);
    });
  });
}
</script>
