<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPG Live -- Classement de ligue</title>
<link rel="stylesheet" href="mpg-tokens.css">
<style>
  /* Meme charte que site/division.html -- police systeme, bordures 0.5px,
     rayon --mpg-radius. */
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: var(--mpg-title); }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .meta { color: var(--mpg-text-soft); font-size: 0.85rem; }
  .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end; margin: 1rem 0; }
  .controls label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.75rem; color: var(--mpg-text-soft); }
  .controls select, .controls input {
    border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius); padding: 0.4rem 0.5rem;
    font-size: 0.9rem; font-family: inherit; color: var(--mpg-title); background: var(--mpg-surface, #fff);
  }
  .controls button {
    background: var(--mpg-action); color: #fff; border: none; border-radius: var(--mpg-radius);
    padding: 0.5rem 1rem; font-size: 0.9rem; font-weight: 600; cursor: pointer;
  }
  .controls button:hover { background: var(--mpg-action-hover); }
  .back-link { font-size: 0.85rem; }
  .search-row { margin: 0.75rem 0; }
  .search-row input {
    width: 100%; border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius);
    padding: 0.5rem 0.75rem; font-size: 0.9rem; font-family: inherit; color: var(--mpg-title);
  }

  .table-wrap { overflow-x: auto; }
  .mpg-table th, .mpg-table td { padding: 0.5rem 0.6rem; border-bottom: 0.5px solid var(--mpg-border-soft); }
  .mpg-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mpg-table td.division { color: var(--mpg-text-soft); font-variant-numeric: tabular-nums; }
  .mpg-table td.team { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .mpg-table tbody tr.hidden { display: none; }
  .badges { display: inline-flex; gap: 0.25rem; flex-wrap: wrap; }

  .status-msg { color: var(--mpg-text-soft); font-size: 0.9rem; margin: 1rem 0; }
  .status-msg.err { color: var(--mpg-danger); }

  /* --- Empilement mobile plutot que scroll horizontal (charte section 5) --- */
  @media (max-width: 640px) {
    .mpg-table thead { display: none; }
    .mpg-table, .mpg-table tbody, .mpg-table tr, .mpg-table td { display: block; width: 100%; }
    .mpg-table tr {
      border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius);
      margin-bottom: 0.5rem; padding: 0.5rem 0.75rem;
    }
    .mpg-table td { border: none; padding: 0.15rem 0; display: flex; justify-content: space-between; }
    .mpg-table td.num { text-align: right; }
    .mpg-table td::before { content: attr(data-label); color: var(--mpg-text-soft); font-size: 0.75rem; }
    .mpg-table td.team::before, .mpg-table td.rank::before { content: none; }
    .mpg-table td.rank { font-weight: 700; font-size: 1.1rem; justify-content: flex-start; gap: 0.5rem; }
  }
</style>
</head>
<body>

<p class="back-link mpg-no-print"><a href="index.html">&larr; Choisir une ligue</a></p>
<h1>Classement de ligue</h1>
<div class="meta" id="subtitle">Chargement...</div>

<div class="controls mpg-no-print">
  <label>Ligue<select id="leagueCode"></select></label>
  <label>userId (ma ligne)<input id="userId" placeholder="user_..." style="width:10em"></label>
  <button id="load-btn">Charger</button>
</div>

<div class="search-row mpg-no-print">
  <input type="text" id="search" placeholder="Rechercher un manager...">
</div>
<p class="meta">Points calculés sur la formule officielle (Pichichi, Mur, Boss, CS, Manita, En feu, Précieux, Grotaldo). Précieux compte seulement une fois la journée archivée.</p>

<div id="status" class="status-msg"></div>
<div id="table-container"></div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // Cle ANONYME/publishable uniquement -- lecture seule, garantie cote base
  // par les policies RLS (cf. db/schema.sql). Meme projet que division.html.
  const SUPABASE_URL = "https://zvmngpoogwjiknqrkjky.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_YhAD0_spZJF58Dt_TTQplQ_VrFSKRK8";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const params = new URLSearchParams(location.search);

  // Saison plus saisissable a la main (retour utilisateur 2026-08-24, "on
  // laisse par defaut la saison en cours car c'est un live") -- toujours
  // resolue depuis leagues.season_search de la ligue choisie. Le selecteur
  // de ligue affiche le NOM (pas le code MPG illisible) -- meme source
  // Supabase que division.html.
  let leaguesByCode = {};

  async function loadLeagueOptions() {
    const { data, error } = await supabase
      .from("leagues")
      .select("nom, code, season_search")
      .order("nom");
    if (error || !data) return;

    leaguesByCode = Object.fromEntries(data.map(l => [l.code, l]));
    const select = document.getElementById("leagueCode");
    select.innerHTML = data.map(l => `<option value="${l.code}">${l.nom.replace(/_/g, " ")}</option>`).join("");

    const wantedCode = params.get("ligue");
    if (wantedCode && leaguesByCode[wantedCode]) select.value = wantedCode;
  }

  // Registre managers (retour utilisateur 2026-08-24, "on voit toujours un
  // nom d'equipe au lieu du realname") -- meme source que division.html.
  let realNameByUid = {};

  async function loadManagerNames() {
    const { data, error } = await supabase.from("managers").select("user_id, real_name");
    if (error || !data) return;
    realNameByUid = Object.fromEntries(data.map(m => [m.user_id, m.real_name]));
  }

  for (const [param, id] of [["user", "userId"]]) {
    const v = params.get(param);
    if (v) document.getElementById(id).value = v;
  }

  const BADGE_TONE = { cs: "success", manita: "fire", onFire: "amber", boss: "gold", pichichi: "violet", mur: "steel" };
  let lastRows = [];

  function fmt(n) {
    if (n === null || n === undefined) return "–";
    return Number.isInteger(n) ? String(n) : n.toFixed(1).replace(/\.0$/, "");
  }

  function badgeHtml(tone, label, value) {
    if (!value) return "";
    return `<span class="mpg-tag mpg-tag-${tone}">${label}${typeof value === "number" ? " " + fmt(value) : ""}</span>`;
  }

  function badgesFor(entry) {
    return `<span class="badges">
      ${badgeHtml(BADGE_TONE.cs, "CS", entry.cleanSheet)}
      ${badgeHtml(BADGE_TONE.manita, "Manita", entry.manita)}
      ${badgeHtml(BADGE_TONE.onFire, "En feu", entry.on_fire)}
      ${badgeHtml(BADGE_TONE.boss, "Boss", entry.boss)}
      ${badgeHtml(BADGE_TONE.pichichi, "Pichichi", entry.pichichi)}
      ${badgeHtml(BADGE_TONE.mur, "Mur", entry.mur)}
    </span>`;
  }

  function rowHtml(entry, isMe) {
    const played = entry.matches_joues ?? 0;
    const displayName = realNameByUid[entry.userId] || entry.teamName || entry.userId;
    return `
      <tr data-name="${displayName.toLowerCase()}" class="${isMe ? "mpg-row-selected" : ""}">
        <td class="rank" data-label="Rang">#${entry.rang_ligue ?? "–"}</td>
        <td class="team" data-label="Équipe">${displayName}</td>
        <td class="division" data-label="Division">D${entry.division}</td>
        <td class="num" data-label="Pts">${fmt(entry.points_ligue)}</td>
        <td class="num" data-label="J">${fmt(played)}</td>
        <td class="num" data-label="V">${fmt(entry.victoires)}</td>
        <td class="num" data-label="N">${fmt(entry.nuls)}</td>
        <td class="num" data-label="D">${fmt(entry.defaites)}</td>
        <td class="num" data-label="BP">${fmt(entry.buts_pour)}</td>
        <td class="num" data-label="BC">${fmt(entry.buts_contre)}</td>
        <td class="num" data-label="DG">${entry.diff > 0 ? "+" : ""}${fmt(entry.diff)}</td>
        <td data-label="Badges">${badgesFor(entry)}</td>
      </tr>`;
  }

  function applyFilter() {
    const query = document.getElementById("search").value.trim().toLowerCase();
    document.querySelectorAll("#table-container tbody tr").forEach(tr => {
      tr.classList.toggle("hidden", query && !tr.dataset.name.includes(query));
    });
  }

  async function load() {
    const leagueCode = document.getElementById("leagueCode").value;
    const league = leaguesByCode[leagueCode];
    const userId = document.getElementById("userId").value.trim();

    const statusEl = document.getElementById("status");
    const subtitleEl = document.getElementById("subtitle");
    const tableEl = document.getElementById("table-container");

    if (!league) { statusEl.textContent = "Choisis une ligue."; return; }
    const season = league.season_search;

    statusEl.textContent = "Chargement...";
    statusEl.className = "status-msg";
    tableEl.innerHTML = "";

    // Pas de filtre division ni limit(1) ici -- une ligne par division,
    // aplaties cote client (contrairement a division.html, qui lit une
    // seule division). rang_ligue/points_ligue sont deja calcules par
    // scripts/live_job.py (core/live_projection.py::resolve_league_wide_ranks),
    // aucune logique de classement cote client.
    const { data, error } = await supabase
      .from("division_classement_live")
      .select("*")
      .eq("league_code", leagueCode)
      .eq("season", season);

    if (error) {
      statusEl.textContent = "Erreur : " + error.message;
      statusEl.className = "status-msg err";
      subtitleEl.textContent = "";
      return;
    }
    if (!data.length) {
      statusEl.textContent = "Aucun classement pour cette ligue/saison (jamais suivie, ou aucune journée pollée).";
      subtitleEl.textContent = "";
      return;
    }

    statusEl.textContent = "";
    const gameWeeks = [...new Set(data.map(r => r.game_week))];
    const latestUpdate = data.reduce((max, r) => (r.updated_at > max ? r.updated_at : max), data[0].updated_at);
    const anyLive = data.some(r => r.is_live);
    subtitleEl.textContent = `${league.nom.replace(/_/g, " ")} · ${data.length} division(s) · Journée ${gameWeeks.length === 1 ? gameWeeks[0] : gameWeeks.join("/")}`
      + `${anyLive ? " · en direct" : " · dernière journée archivée"} · mis à jour ${new Date(latestUpdate).toLocaleString("fr-FR")}`;

    const entries = data.flatMap(row => (row.data || []).map(e => ({ ...e, division: row.division })));
    entries.sort((a, b) => (a.rang_ligue ?? Infinity) - (b.rang_ligue ?? Infinity));
    lastRows = entries;

    tableEl.innerHTML = `
      <div class="table-wrap">
        <table class="mpg-table">
          <thead><tr>
            <th>Rang</th><th>Équipe</th><th>Div</th><th>Pts</th><th>J</th><th>V</th><th>N</th><th>D</th>
            <th>BP</th><th>BC</th><th>DG</th><th>Badges</th>
          </tr></thead>
          <tbody>${entries.map(e => rowHtml(e, userId && e.userId === userId)).join("")}</tbody>
        </table>
      </div>`;
    applyFilter();
  }

  document.getElementById("load-btn").addEventListener("click", load);
  document.getElementById("search").addEventListener("input", applyFilter);
  await Promise.all([loadLeagueOptions(), loadManagerNames()]);
  load();
</script>

</body>
</html>
