<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPG Live -- Classement de division</title>
<link rel="stylesheet" href="mpg-tokens.css">
<style>
  /* Jetons de la charte "Mon Propre Gazon" -- police systeme, bordures
     0.5px, rayon --mpg-radius (meme convention que site/manager.html). */
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: var(--mpg-title); }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .meta { color: var(--mpg-text-soft); font-size: 0.85rem; }
  .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end; margin: 1rem 0; }
  .controls label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.75rem; color: var(--mpg-text-soft); }
  .controls select, .controls input {
    border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius); padding: 0.4rem 0.5rem;
    font-size: 0.9rem; font-family: inherit; color: var(--mpg-title); background: var(--mpg-surface, #fff);
  }
  .controls button {
    background: var(--mpg-action); color: #fff; border: none; border-radius: var(--mpg-radius);
    padding: 0.5rem 1rem; font-size: 0.9rem; font-weight: 600; cursor: pointer;
  }
  .controls button:hover { background: var(--mpg-action-hover); }
  .back-link { font-size: 0.85rem; }

  /* --- Carte "Ma situation" --- */
  .situation-card {
    border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius);
    padding: 1rem 1.25rem; margin: 1rem 0; background: var(--mpg-action-soft);
  }
  .situation-card h2 { margin: 0 0 0.75rem; font-size: 1rem; color: var(--mpg-title); }
  .situation-grid { display: flex; gap: 1.5rem; flex-wrap: wrap; }
  .situation-item .value { font-size: 1.5rem; font-weight: 700; color: var(--mpg-action); line-height: 1.2; }
  .situation-item .label { font-size: 0.75rem; color: var(--mpg-text-soft); }
  .situation-note { margin: 0.75rem 0 0; font-size: 0.75rem; color: var(--mpg-text-soft); }

  /* --- Tableau --- */
  .table-wrap { overflow-x: auto; }
  .mpg-table th, .mpg-table td { padding: 0.5rem 0.6rem; border-bottom: 0.5px solid var(--mpg-border-soft); }
  .mpg-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mpg-table td.team { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .badges { display: inline-flex; gap: 0.25rem; flex-wrap: wrap; }

  .status-msg { color: var(--mpg-text-soft); font-size: 0.9rem; margin: 1rem 0; }
  .status-msg.err { color: var(--mpg-danger); }

  /* --- Simulateur de bonus --- */
  .sim-card {
    border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius);
    padding: 1rem 1.25rem; margin: 1rem 0;
  }
  .sim-card h2 { margin: 0 0 0.25rem; font-size: 1rem; }
  .sim-card .meta { margin: 0 0 0.75rem; }
  .sim-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end; margin-bottom: 0.75rem; }
  .sim-row label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.75rem; color: var(--mpg-text-soft); }
  .sim-row select, .sim-row input {
    border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius); padding: 0.4rem 0.5rem;
    font-size: 0.9rem; font-family: inherit; color: var(--mpg-title); background: var(--mpg-surface, #fff);
  }
  .sim-row button {
    background: var(--mpg-action); color: #fff; border: none; border-radius: var(--mpg-radius);
    padding: 0.5rem 1rem; font-size: 0.9rem; font-weight: 600; cursor: pointer;
  }
  .sim-row button:hover { background: var(--mpg-action-hover); }
  .sim-result { display: flex; gap: 2rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .sim-result .side { text-align: center; }
  .sim-result .side.me .total { color: var(--mpg-action); }
  .sim-result .total { font-size: 1.6rem; font-weight: 700; }
  .sim-result .label { font-size: 0.75rem; color: var(--mpg-text-soft); }
  .sweep-bad { color: var(--mpg-danger); font-weight: 600; }

  /* --- Empilement mobile plutot que scroll horizontal (charte section 5) --- */
  @media (max-width: 640px) {
    .mpg-table thead { display: none; }
    .mpg-table, .mpg-table tbody, .mpg-table tr, .mpg-table td { display: block; width: 100%; }
    .mpg-table tr {
      border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius);
      margin-bottom: 0.5rem; padding: 0.5rem 0.75rem;
    }
    .mpg-table td { border: none; padding: 0.15rem 0; display: flex; justify-content: space-between; }
    .mpg-table td.num { text-align: right; }
    .mpg-table td::before { content: attr(data-label); color: var(--mpg-text-soft); font-size: 0.75rem; }
    .mpg-table td.team::before { content: none; }
    .mpg-table td.rank::before { content: none; }
    .mpg-table td.rank { font-weight: 700; font-size: 1.1rem; justify-content: flex-start; gap: 0.5rem; }
  }
</style>
</head>
<body>

<p class="back-link mpg-no-print"><a href="index.html">&larr; Choisir une ligue</a></p>
<h1>Classement de division</h1>
<div class="meta" id="subtitle">Chargement...</div>

<div class="controls mpg-no-print">
  <label>Ligue<select id="leagueCode"></select></label>
  <label>Division<select id="division"></select></label>
  <label>Manager (Ma situation)<select id="userId" style="min-width:12em"><option value="">— Ma situation (optionnel) —</option></select></label>
  <button id="load-btn">Charger</button>
</div>

<div id="situation"></div>
<div id="simulator"></div>
<div id="status" class="status-msg"></div>
<div id="table-container"></div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // Cle ANONYME/publishable uniquement -- jamais la cle service_role/secret,
  // qui reste un secret GitHub Actions cote scripts/live_job.py. Lecture
  // seule ici, garantie cote base par les policies RLS (cf. db/schema.sql).
  const SUPABASE_URL = "https://zvmngpoogwjiknqrkjky.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_YhAD0_spZJF58Dt_TTQplQ_VrFSKRK8";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const params = new URLSearchParams(location.search);

  // La saison n'est plus un champ saisissable (retour utilisateur 2026-08-24,
  // "on laisse par defaut la saison en cours car c'est un live") -- toujours
  // resolue depuis leagues.season_search de la ligue choisie, jamais tapee a
  // la main. Idem pour le nombre de divisions (players_number/
  // players_per_division), qui remplace le champ Division en liste
  // deroulante -- plus de flecheurs +/- sur un nombre qu'on ne connait pas
  // d'avance par ligue (12 a 18 selon la ligue).
  let leaguesByCode = {};

  async function loadLeagueOptions() {
    const { data, error } = await supabase
      .from("leagues")
      .select("nom, code, season_search, players_number, players_per_division")
      .order("nom");
    if (error || !data) return;

    leaguesByCode = Object.fromEntries(data.map(l => [l.code, l]));
    const select = document.getElementById("leagueCode");
    select.innerHTML = data.map(l => `<option value="${l.code}">${l.nom.replace(/_/g, " ")}</option>`).join("");

    const wantedCode = params.get("ligue");
    if (wantedCode && leaguesByCode[wantedCode]) select.value = wantedCode;

    populateDivisionOptions();
  }

  function populateDivisionOptions() {
    const league = leaguesByCode[document.getElementById("leagueCode").value];
    const divisionSelect = document.getElementById("division");
    if (!league) { divisionSelect.innerHTML = ""; return; }

    const totalDivisions = Math.round(league.players_number / league.players_per_division);
    const options = [];
    for (let d = 1; d <= totalDivisions; d++) options.push(`<option value="${d}">Division ${d}</option>`);
    divisionSelect.innerHTML = options.join("");

    const wantedDivision = params.get("division");
    if (wantedDivision && Number(wantedDivision) <= totalDivisions) divisionSelect.value = wantedDivision;
  }

  document.getElementById("leagueCode").addEventListener("change", populateDivisionOptions);

  // Registre managers (retour utilisateur 2026-08-24, "on voit toujours un
  // nom d'equipe au lieu du realname") -- {userId: RealName}, charge une
  // seule fois. Pas dans `leagues`/`division_classement_live` : nom
  // d'equipe MPG et vrai nom de manager sont deux notions distinctes,
  // celle-ci vient de scripts/seed_managers.py (source locale MPG_Users.json,
  // aucun endpoint MPG n'expose le RealName directement).
  let realNameByUid = {};

  async function loadManagerNames() {
    const { data, error } = await supabase.from("managers").select("user_id, real_name");
    if (error || !data) return;
    realNameByUid = Object.fromEntries(data.map(m => [m.user_id, m.real_name]));
  }

  // Simulateur de bonus (retour utilisateur 2026-08-24, "on permettra aux
  // managers de faire des simulations de situations selon les bonus mis ou
  // non", puis "regarde bien ce qui a deja ete fait ... tout est
  // disponible, il faut que tu branches tout") -- port de admin/manager.html
  // (mpg_app), memes constantes/logique, adapte a la fonction cloud
  // simulate_api/app.py au lieu de l'API locale relative. Deux volets :
  // "Mon Bonus" (choix manuel, simulate-bonus) et "Bonus Adverse -- etat
  // des lieux" (balayage automatique de TOUS les bonus possibles pour la
  // taille de division, live-scenario-sweep).
  const SIMULATE_API_BASE = "https://mpg-live.onrender.com";

  const BONUS_OPTIONS = [
    { value: "", label: "Aucun" },
    { value: "boostAllPlayers", label: "Zahia (+0,5 à tous)" },
    { value: "boostOnePlayer", label: "McDo+ (+1 à un titu)" },
    { value: "nerfGoalkeeper", label: "Suarez (-1 gardien)" },
    { value: "nerfAllPlayers", label: "Cheat Code (-0,5 adverses)" },
    { value: "blockTacticalSubs", label: "Tonton Pat' (bloque tactiques adv.)" },
    { value: "removeGoal", label: "Valise à Nanard (annule 1 but adv.)" },
    { value: "mirror", label: "Miroir (renvoie/vole le coup adv.)" },
  ];
  // Taille de division MINIMALE a partir de laquelle chaque bonus existe --
  // tableau officiel MPG, miroir de core.live_scoring.BONUS_MIN_DIVISION_SIZE
  // (garder les deux synchronises).
  const BONUS_MIN_DIVISION_SIZE = {
    removeGoal: 4, boostOnePlayer: 4,
    nerfGoalkeeper: 6, boostAllPlayers: 6, mirror: 6,
    nerfAllPlayers: 8, blockTacticalSubs: 8,
  };
  // Seul boostOnePlayer (McDo+) a besoin d'une cible choisie a la main, et
  // cette cible est TOUJOURS un joueur de SA PROPRE equipe (auto-buff, pas
  // un joueur adverse) -- Miroir peut voler le McDo+ adverse automatiquement
  // (meme slot), pas de selection manuelle a prevoir pour ca.
  const BONUS_NEEDS_TARGET = new Set(["boostOnePlayer"]);

  function bonusOptionsForDivisionSize(divisionSize) {
    return BONUS_OPTIONS.filter(o => !o.value || divisionSize >= (BONUS_MIN_DIVISION_SIZE[o.value] || 0));
  }
  function optionsHtml(options, selectedValue) {
    return options.map(o => `<option value="${o.value}"${o.value === (selectedValue || "") ? " selected" : ""}>${o.label}</option>`).join("");
  }
  function targetOptionsHtml(list, selectedId) {
    return list.map(p => `<option value="${p.id}"${p.id === selectedId ? " selected" : ""}>${p.name}</option>`).join("");
  }
  // Port de targetSelectHtml (admin/manager.html) -- la cible est TOUJOURS
  // MA PROPRE equipe (myTeam), jamais celle de l'adversaire (cf. BONUS_NEEDS_
  // TARGET ci-dessus). Inclut les titulaires deja remplaces mais dont le
  // vrai match n'a pas encore demarre (is_default_rating) dans un groupe a
  // part -- on peut encore tester "et si j'avais mis McDo+ sur LUI" tant que
  // son vrai match n'est pas joue, meme s'il a deja ete sorti tactiquement.
  function targetSelectHtml(myTeam, selectedId, hidden) {
    const players = Object.entries(myTeam.players || {})
      .filter(([, p]) => p.position !== 1) // jamais le gardien, cf. reglement MPG
      .map(([id, p]) => ({ id, name: p.name }));
    const outPlayers = (myTeam.out || [])
      .filter(p => p.is_default_rating)
      .map(p => ({ id: p.playerId, name: p.name }));
    const outGroup = outPlayers.length
      ? `<optgroup label="Déjà remplacés (vrai match pas encore joué)">${targetOptionsHtml(outPlayers, selectedId)}</optgroup>`
      : "";
    return `<select id="sim-target-player" style="${hidden ? "display:none" : ""}"><option value="">— choisir le titu —</option>${targetOptionsHtml(players, selectedId)}${outGroup}</select>`;
  }

  function simulatorHtml(entry, leagueCode, division, gameWeek) {
    if (!entry) return "";
    return `
      <div class="sim-card">
        <h2>Simulateur de bonus</h2>
        <p class="meta">Journée ${gameWeek} -- teste "et si je joue tel coup", et l'état des lieux
        de tous les coups adverses possibles, sans rien changer sur MPG. Surtout utile en direct.</p>
        <div class="sim-row">
          <label>Mon coup<select id="sim-own-bonus">${optionsHtml(BONUS_OPTIONS, "")}</select></label>
          <span id="sim-target-wrap"></span>
          <button id="sim-run-btn">Simuler</button>
        </div>
        <div id="sim-status" class="status-msg">Chargement des compositions...</div>
        <div id="sim-result"></div>
        <div id="sweep-panel"></div>
      </div>`;
  }

  function simResultHtml(match, myUserId) {
    const meIsHome = match.home.userId === myUserId;
    const me = meIsHome ? match.home : match.away;
    const opponent = meIsHome ? match.away : match.home;
    return `
      <div class="sim-result">
        <div class="side me">
          <div class="total">${fmt(me.total)}</div>
          <div class="label">Moi (${fmt(me.score)} buts)</div>
        </div>
        <div class="side">
          <div class="total">${fmt(opponent.total)}</div>
          <div class="label">Adversaire (${fmt(opponent.score)} buts)</div>
        </div>
      </div>`;
  }

  // --- "Bonus Adverse -- etat des lieux" (port de sweepTableHtml/oddsBarHtml) ---
  function classifyResult(myScore, theirScore) {
    if (myScore > theirScore) return "win";
    if (myScore < theirScore) return "loss";
    return "draw";
  }
  function computeOutcomeOdds(data) {
    const rowsByType = {};
    for (const s of data.scenarios) (rowsByType[s.opponentBonus] ||= []).push(s);
    const weights = { win: 0, draw: 0, loss: 0 };
    weights[classifyResult(data.baseline.myScore, data.baseline.theirScore)] += 1;
    let typeCount = 1;
    Object.values(rowsByType).forEach(rows => {
      typeCount += 1;
      const share = 1 / rows.length;
      rows.forEach(r => { weights[classifyResult(r.myScore, r.theirScore)] += share; });
    });
    return {
      win: Math.round((weights.win / typeCount) * 100),
      draw: Math.round((weights.draw / typeCount) * 100),
      loss: Math.round((weights.loss / typeCount) * 100),
      total: typeCount,
    };
  }
  function oddsBarHtml(data) {
    const odds = computeOutcomeOdds(data);
    const seg = (tone, pct) => pct > 0 ? `<span class="mpg-tag mpg-tag-${tone}" style="flex:${pct}">${pct}%</span>` : "";
    return `
      <p class="meta" style="margin:0.75rem 0 0.25rem;">Chances de résultat (à l'instant T)</p>
      <div style="display:flex; gap:0.25rem;">
        ${seg("success", odds.win)}${seg("steel", odds.draw)}${seg("danger", odds.loss)}
      </div>
      <p class="meta">Victoire ${odds.win}% · Nul ${odds.draw}% · Défaite ${odds.loss}% -- état actuel + 1 poids par type de bonus adverse possible (${odds.total} au total).</p>`;
  }
  function swingText(row) {
    const swing = row.deltaMine - row.deltaTheirs;
    if (swing === 0) return "=";
    return swing > 0 ? `+${swing}` : `${swing}`;
  }
  function sweepTableHtml(data, isHome) {
    const rows = data.scenarios.map(s => {
      const homeScore = isHome ? s.myScore : s.theirScore;
      const awayScore = isHome ? s.theirScore : s.myScore;
      const swing = s.deltaMine - s.deltaTheirs;
      const swingClass = swing < 0 ? "sweep-bad" : "";
      return `
        <tr>
          <td title="${s.label}">${s.label}</td>
          <td class="num">${homeScore}</td>
          <td class="num">${awayScore}</td>
          <td class="num ${swingClass}">${swingText(s)}</td>
        </tr>`;
    }).join("");
    return `
      ${oddsBarHtml(data)}
      <div class="table-wrap">
        <table class="mpg-table">
          <thead><tr><th></th><th class="num">Domicile</th><th class="num">Extérieur</th><th class="num">Δ</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <p class="meta">Δ = évolution de la différence de buts en ma faveur si l'adversaire joue ce bonus (négatif = mauvais pour moi).</p>`;
  }

  async function runSweep(leagueCode, division, gameWeek, userId, ownBonus, targetPlayerId, isHome) {
    const sweepEl = document.getElementById("sweep-panel");
    sweepEl.innerHTML = `<p class="meta">Bonus adverse -- état des lieux : analyse en cours...</p>`;
    try {
      const url = new URL(`${SIMULATE_API_BASE}/live-scenario-sweep`);
      url.searchParams.set("shortId", leagueCode);
      url.searchParams.set("season", leaguesByCode[leagueCode].season_search);
      url.searchParams.set("division", division);
      url.searchParams.set("gameweek", gameWeek);
      url.searchParams.set("userId", userId);
      if (ownBonus) url.searchParams.set("ownBonus", ownBonus);
      if (targetPlayerId) url.searchParams.set("targetPlayerId", targetPlayerId);

      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      sweepEl.innerHTML = `<h3 style="font-size:0.9rem;">Bonus adverse -- état des lieux</h3>` + sweepTableHtml(data, isHome);
    } catch (e) {
      sweepEl.innerHTML = `<p class="status-msg err">Bonus adverse indisponible (${e.message}).</p>`;
    }
  }

  let lastBaselineMatch = null;

  function updateTargetVisibility(myUserId) {
    const ownBonus = document.getElementById("sim-own-bonus").value;
    const wrap = document.getElementById("sim-target-wrap");
    if (!lastBaselineMatch) { wrap.innerHTML = ""; return; }
    const meIsHome = lastBaselineMatch.home.userId === myUserId;
    const myTeam = meIsHome ? lastBaselineMatch.home : lastBaselineMatch.away;
    const hidden = !BONUS_NEEDS_TARGET.has(ownBonus);
    wrap.innerHTML = `<label>Cible (McDo+)${targetSelectHtml(myTeam, "", hidden)}</label>`;
  }

  async function initSimulator(leagueCode, division, gameWeek, userId, divisionSize) {
    const statusEl = document.getElementById("sim-status");
    const ownSelect = document.getElementById("sim-own-bonus");
    ownSelect.innerHTML = optionsHtml(bonusOptionsForDivisionSize(divisionSize), "");
    ownSelect.addEventListener("change", () => updateTargetVisibility(userId));

    try {
      const url = new URL(`${SIMULATE_API_BASE}/simulate-bonus`);
      url.searchParams.set("shortId", leagueCode);
      url.searchParams.set("season", leaguesByCode[leagueCode].season_search);
      url.searchParams.set("division", division);
      url.searchParams.set("gameweek", gameWeek);
      url.searchParams.set("userId", userId);
      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      lastBaselineMatch = data;
      statusEl.textContent = "";
      updateTargetVisibility(userId);
      const meIsHome = data.home.userId === userId;
      document.getElementById("sweep-panel").innerHTML = "";
      runSweep(leagueCode, division, gameWeek, userId, "", "", meIsHome);
    } catch (e) {
      statusEl.textContent = "Simulateur indisponible pour le moment (" + e.message + "). Le service met parfois jusqu'à 30s à se réveiller.";
      statusEl.className = "status-msg err";
    }
  }

  async function simulateBonus(leagueCode, division, gameWeek, userId) {
    const statusEl = document.getElementById("sim-status");
    const resultEl = document.getElementById("sim-result");
    const ownBonus = document.getElementById("sim-own-bonus").value;
    const targetSelect = document.getElementById("sim-target-player");
    const targetPlayerId = targetSelect ? targetSelect.value : "";

    statusEl.textContent = "Simulation en cours...";
    statusEl.className = "status-msg";
    resultEl.innerHTML = "";

    try {
      const url = new URL(`${SIMULATE_API_BASE}/simulate-bonus`);
      url.searchParams.set("shortId", leagueCode);
      url.searchParams.set("season", leaguesByCode[leagueCode].season_search);
      url.searchParams.set("division", division);
      url.searchParams.set("gameweek", gameWeek);
      url.searchParams.set("userId", userId);
      if (ownBonus) url.searchParams.set("ownBonus", ownBonus);
      if (targetPlayerId) url.searchParams.set("targetPlayerId", targetPlayerId);

      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok) {
        statusEl.textContent = "Erreur : " + (data.error || res.statusText);
        statusEl.className = "status-msg err";
        return;
      }
      statusEl.textContent = "";
      lastBaselineMatch = data;
      resultEl.innerHTML = simResultHtml(data, userId);
      const meIsHome = data.home.userId === userId;
      runSweep(leagueCode, division, gameWeek, userId, ownBonus, targetPlayerId, meIsHome);
    } catch (e) {
      statusEl.textContent = "Simulation indisponible pour le moment (" + e.message + ").";
      statusEl.className = "status-msg err";
    }
  }

  // Selecteur de manager par VRAI nom (retour utilisateur 2026-08-24, "on
  // choisit le joueur avec son vrai nom") -- remplace le userId tape a la
  // main, construit a partir des entries deja chargees + du registre
  // managers (realNameByUid, cf. loadManagerNames ci-dessus).
  function populateUserSelect(entries) {
    const select = document.getElementById("userId");
    const wanted = select.value || params.get("user") || "";
    const sorted = [...entries].sort((a, b) =>
      (realNameByUid[a.userId] || a.teamName || a.userId).localeCompare(realNameByUid[b.userId] || b.teamName || b.userId));
    select.innerHTML = `<option value="">— Ma situation (optionnel) —</option>` +
      sorted.map(e => `<option value="${e.userId}">${realNameByUid[e.userId] || e.teamName || e.userId}</option>`).join("");
    if (wanted && entries.some(e => e.userId === wanted)) select.value = wanted;
  }

  const BADGE_TONE = { cs: "success", manita: "fire", onFire: "amber", boss: "gold", pichichi: "violet", mur: "steel" };

  function fmt(n) {
    if (n === null || n === undefined) return "–";
    return Number.isInteger(n) ? String(n) : n.toFixed(1).replace(/\.0$/, "");
  }

  function badgeHtml(tone, label, value) {
    if (!value) return "";
    return `<span class="mpg-tag mpg-tag-${tone}">${label}${typeof value === "number" ? " " + fmt(value) : ""}</span>`;
  }

  function badgesFor(entry) {
    return `<span class="badges">
      ${badgeHtml(BADGE_TONE.cs, "CS", entry.cleanSheet)}
      ${badgeHtml(BADGE_TONE.manita, "Manita", entry.manita)}
      ${badgeHtml(BADGE_TONE.onFire, "En feu", entry.on_fire)}
      ${badgeHtml(BADGE_TONE.boss, "Boss", entry.boss)}
      ${badgeHtml(BADGE_TONE.pichichi, "Pichichi", entry.pichichi)}
      ${badgeHtml(BADGE_TONE.mur, "Mur", entry.mur)}
    </span>`;
  }

  function rowHtml(entry, isMe) {
    const played = entry.matches_joues ?? 0;
    return `
      <tr class="${isMe ? "mpg-row-selected" : ""}">
        <td class="rank" data-label="Rang">#${entry.rang}</td>
        <td class="team" data-label="Équipe">${realNameByUid[entry.userId] || entry.teamName || entry.userId}</td>
        <td class="num" data-label="Pts">${fmt(entry.points)}</td>
        <td class="num" data-label="J">${fmt(played)}</td>
        <td class="num" data-label="V">${fmt(entry.victoires)}</td>
        <td class="num" data-label="N">${fmt(entry.nuls)}</td>
        <td class="num" data-label="D">${fmt(entry.defaites)}</td>
        <td class="num" data-label="BP">${fmt(entry.buts_pour)}</td>
        <td class="num" data-label="BC">${fmt(entry.buts_contre)}</td>
        <td class="num" data-label="DG">${entry.diff > 0 ? "+" : ""}${fmt(entry.diff)}</td>
        <td data-label="Badges">${badgesFor(entry)}</td>
      </tr>`;
  }

  function situationHtml(entry) {
    if (!entry) return "";
    return `
      <div class="situation-card">
        <h2>Ma situation</h2>
        <div class="situation-grid">
          <div class="situation-item"><div class="value">#${entry.rang}</div><div class="label">Rang de division</div></div>
          <div class="situation-item"><div class="value">${entry.rang_ligue != null ? "#" + entry.rang_ligue : "–"}</div><div class="label">Rang de ligue</div></div>
          <div class="situation-item"><div class="value">${fmt(entry.points_ligue)}</div><div class="label">Points (ligue)</div></div>
        </div>
        <p class="situation-note">Rang de ligue/points calculés sur la formule officielle (Pichichi, Mur, Boss, CS, Manita, En feu, Précieux, Grotaldo). Précieux compte seulement une fois la journée archivée.</p>
      </div>`;
  }

  async function load() {
    const leagueCode = document.getElementById("leagueCode").value;
    const league = leaguesByCode[leagueCode];
    const division = Number(document.getElementById("division").value);

    const statusEl = document.getElementById("status");
    const subtitleEl = document.getElementById("subtitle");
    const situationEl = document.getElementById("situation");
    const simulatorEl = document.getElementById("simulator");
    const tableEl = document.getElementById("table-container");

    if (!league) { statusEl.textContent = "Choisis une ligue."; return; }

    statusEl.textContent = "Chargement...";
    statusEl.className = "status-msg";
    situationEl.innerHTML = "";
    simulatorEl.innerHTML = "";
    tableEl.innerHTML = "";

    const { data, error } = await supabase
      .from("division_classement_live")
      .select("*")
      .eq("league_code", leagueCode)
      .eq("season", league.season_search)
      .eq("division", division)
      .limit(1);

    if (error) {
      statusEl.textContent = "Erreur : " + error.message;
      statusEl.className = "status-msg err";
      subtitleEl.textContent = "";
      return;
    }
    if (!data.length) {
      statusEl.textContent = "Aucun classement pour cette ligue/division (jamais suivie, ou journée pas encore pollée).";
      subtitleEl.textContent = "";
      return;
    }

    const row = data[0];
    statusEl.textContent = "";
    subtitleEl.textContent = `${league.nom.replace(/_/g, " ")} · Journée ${row.game_week}`
      + `${row.is_live ? " · en direct" : " · dernière journée archivée"} · mis à jour ${new Date(row.updated_at).toLocaleString("fr-FR")}`;

    const entries = row.data || [];
    populateUserSelect(entries);
    const userId = document.getElementById("userId").value.trim();
    const myEntry = userId ? entries.find(e => e.userId === userId) : null;
    situationEl.innerHTML = situationHtml(myEntry);
    simulatorEl.innerHTML = simulatorHtml(myEntry, leagueCode, division, row.game_week);
    if (myEntry) {
      document.getElementById("sim-run-btn").addEventListener("click", () => {
        simulateBonus(leagueCode, division, row.game_week, userId);
      });
      initSimulator(leagueCode, division, row.game_week, userId, league.players_per_division);
    }

    tableEl.innerHTML = `
      <div class="table-wrap">
        <table class="mpg-table">
          <thead><tr>
            <th>Rang</th><th>Équipe</th><th>Pts</th><th>J</th><th>V</th><th>N</th><th>D</th>
            <th>BP</th><th>BC</th><th>DG</th><th>Badges</th>
          </tr></thead>
          <tbody>${entries.map(e => rowHtml(e, userId && e.userId === userId)).join("")}</tbody>
        </table>
      </div>`;
  }

  document.getElementById("load-btn").addEventListener("click", load);
  document.getElementById("userId").addEventListener("change", load);
  await Promise.all([loadLeagueOptions(), loadManagerNames()]);
  load();
</script>

</body>
</html>
