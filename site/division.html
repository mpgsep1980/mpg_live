<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPG Live -- Classement de division</title>
<link rel="stylesheet" href="mpg-tokens.css">
<style>
  /* Jetons de la charte "Mon Propre Gazon" -- police systeme, bordures
     0.5px, rayon --mpg-radius (meme convention que site/manager.html). */
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: var(--mpg-title); }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .meta { color: var(--mpg-text-soft); font-size: 0.85rem; }
  .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end; margin: 1rem 0; }
  .controls label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.75rem; color: var(--mpg-text-soft); }
  .controls select, .controls input {
    border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius); padding: 0.4rem 0.5rem;
    font-size: 0.9rem; font-family: inherit; color: var(--mpg-title); background: var(--mpg-surface, #fff);
  }
  .controls button {
    background: var(--mpg-action); color: #fff; border: none; border-radius: var(--mpg-radius);
    padding: 0.5rem 1rem; font-size: 0.9rem; font-weight: 600; cursor: pointer;
  }
  .controls button:hover { background: var(--mpg-action-hover); }
  .back-link { font-size: 0.85rem; }

  /* --- Carte "Ma situation" --- */
  .situation-card {
    border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius);
    padding: 1rem 1.25rem; margin: 1rem 0; background: var(--mpg-action-soft);
  }
  .situation-card h2 { margin: 0 0 0.75rem; font-size: 1rem; color: var(--mpg-title); }
  .situation-grid { display: flex; gap: 1.5rem; flex-wrap: wrap; }
  .situation-item .value { font-size: 1.5rem; font-weight: 700; color: var(--mpg-action); line-height: 1.2; }
  .situation-item .label { font-size: 0.75rem; color: var(--mpg-text-soft); }
  .situation-note { margin: 0.75rem 0 0; font-size: 0.75rem; color: var(--mpg-text-soft); }

  /* --- Toutes mes divisions (expanders) --- */
  .division-expander {
    border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius); margin: 0.75rem 0; overflow: hidden;
  }
  .division-expander summary {
    display: flex; align-items: center; gap: 0.6rem; padding: 0.85rem 1.1rem; cursor: pointer;
    list-style: none; font-size: 0.95rem;
  }
  .division-expander summary::-webkit-details-marker { display: none; }
  .division-expander summary::before { content: "▸"; color: var(--mpg-text-off); transition: transform 150ms ease; }
  .division-expander[open] summary::before { transform: rotate(90deg); }
  .summary-dot { width: 0.6rem; height: 0.6rem; border-radius: 999px; flex-shrink: 0; }
  .summary-league { font-weight: 700; }
  .summary-division { color: var(--mpg-text-soft); font-size: 0.85rem; }
  .summary-status { margin-left: auto; font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
  .expander-body { padding: 0.5rem 1.1rem 1.1rem; border-top: 0.5px solid var(--mpg-border-soft); }

  /* --- Resultats de la journee --- */
  .matches-card {
    border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius);
    padding: 1rem 1.25rem; margin: 1rem 0;
  }
  .matches-card h2 { margin: 0 0 0.75rem; font-size: 1rem; color: var(--mpg-title); }
  .match-row {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.75rem; align-items: center;
    padding: 0.5rem 0; border-bottom: 0.5px solid var(--mpg-border-soft); font-size: 0.9rem;
    text-decoration: none; color: inherit; border-radius: var(--mpg-radius-sm);
  }
  .match-row:hover { background-color: var(--mpg-border-soft); }
  .match-row:last-child { border-bottom: none; }
  .match-team { display: flex; align-items: center; gap: 0.3rem; }
  .match-team.away { justify-content: flex-end; text-align: right; }
  .match-score { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; padding: 0 0.5rem; }

  /* --- Tableau --- */
  .table-wrap { overflow-x: auto; }
  .mpg-table th, .mpg-table td { padding: 0.5rem 0.6rem; border-bottom: 0.5px solid var(--mpg-border-soft); }
  .mpg-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mpg-table td.team { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .badges { display: inline-flex; gap: 0.25rem; flex-wrap: wrap; }

  .status-msg { color: var(--mpg-text-soft); font-size: 0.9rem; margin: 1rem 0; }
  .status-msg.err { color: var(--mpg-danger); }

  /* --- Empilement mobile plutot que scroll horizontal (charte section 5) ---
     Retour utilisateur 2026-08-25, "c'est tres moche" : l'ancien
     display:flex;justify-content:space-between etirait chaque paire
     label/valeur sur toute la largeur de la carte (~340px), rendant la
     valeur illisible tres loin de son libelle (ex. "Pts" a gauche, "3" seul
     tout a droite). Les stats numeriques (.num) sont maintenant des puces
     compactes en ligne, qui s'enchainent/wrap plusieurs par ligne -- rang/
     equipe/badges restent en pleine largeur (titre de carte). */
  @media (max-width: 640px) {
    .mpg-table thead { display: none; }
    .mpg-table, .mpg-table tbody, .mpg-table tr, .mpg-table td { display: block; width: 100%; }
    .mpg-table tr {
      border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius);
      margin-bottom: 0.5rem; padding: 0.5rem 0.75rem;
    }
    .mpg-table td { border: none; padding: 0.15rem 0; }
    .mpg-table td::before { content: attr(data-label); color: var(--mpg-text-soft); font-size: 0.75rem; }
    .mpg-table td.team::before { content: none; }
    .mpg-table td.rank::before { content: none; }
    .mpg-table td.rank { font-weight: 700; font-size: 1.1rem; }
    .mpg-table td.num {
      display: inline-flex; width: auto; align-items: baseline; gap: 0.25rem;
      padding: 0.15rem 0.6rem 0.15rem 0;
    }
    .mpg-table td.num::before { content: attr(data-label) " :"; }
    .mpg-table td[data-label="Badges"] { padding-top: 0.35rem; }
  }
</style>
</head>
<body>

<header class="mpg-banner mpg-no-print">
  <div class="mpg-banner-inner">
    <a class="mpg-banner-title" href="index.html">MPG part en LIVE</a>
    <nav class="mpg-banner-nav">
      <a class="mpg-banner-item" href="index.html">Accueil</a>
      <a class="mpg-banner-item" href="simulations.html">Live</a>
    </nav>
    <label class="mpg-banner-manager mpg-no-print">
      <select id="global-manager"><option value="">— Manager —</option></select>
    </label>
  </div>
</header>
<script>
  for (const a of document.querySelectorAll(".mpg-banner-item")) {
    if (a.pathname === location.pathname) a.classList.add("is-active");
  }
</script>

<h1>Classement de division</h1>
<div class="meta" id="subtitle">Chargement...</div>

<div class="controls mpg-no-print">
  <label>Ligue<select id="leagueCode"></select></label>
  <label>Division<select id="division"></select></label>
  <button id="locate-btn" title="Où suis-je ?">📍 Où suis-je ?</button>
</div>

<div id="all-status" class="status-msg"></div>
<div id="all-divisions"></div>

<div id="single-division-view" style="display:none">
  <p class="back-link mpg-no-print" id="back-to-all"></p>
  <div id="situation"></div>
  <div id="status" class="status-msg"></div>
  <div id="table-container"></div>
  <div id="matches"></div>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // Cle ANONYME/publishable uniquement -- jamais la cle service_role/secret,
  // qui reste un secret GitHub Actions cote scripts/live_job.py. Lecture
  // seule ici, garantie cote base par les policies RLS (cf. db/schema.sql).
  const SUPABASE_URL = "https://zvmngpoogwjiknqrkjky.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_YhAD0_spZJF58Dt_TTQplQ_VrFSKRK8";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const params = new URLSearchParams(location.search);

  // La saison n'est plus un champ saisissable (retour utilisateur 2026-08-24,
  // "on laisse par defaut la saison en cours car c'est un live") -- toujours
  // resolue depuis leagues.season_search de la ligue choisie, jamais tapee a
  // la main. Idem pour le nombre de divisions (players_number/
  // players_per_division), qui remplace le champ Division en liste
  // deroulante -- plus de flecheurs +/- sur un nombre qu'on ne connait pas
  // d'avance par ligue (12 a 18 selon la ligue).
  let leaguesByCode = {};

  // Theme de couleur par ligue (bandeau/en-tete de tableau, cf. mpg-tokens.css
  // ".mpg-head-*") -- les 6 ligues suivies sont fixes (League_Codes.json cote
  // mpg_app) et leur nom encode deja le championnat reel qu'elles imitent
  // (confirme par le rendu HTML du site d'Ilan, memes couleurs par ligue) :
  // Camembert=France/L1, Rosbeef=Angleterre/PL, Tapas=Espagne/Liga,
  // Calzone=Italie/SerieA, Ligue_2_EKT=France/L2, Champignons=C1/LDC.
  const LEAGUE_THEME_BY_NOM = {
    "ligue_camembert": "l1",
    "rosbeef_league": "pl",
    "liga_tapas": "liga",
    "lega_calzone": "seriea",
    "ligue_2_ekt": "l2",
    "ligue_des_champignons": "ldc",
  };
  function leagueTheme(nom) {
    return LEAGUE_THEME_BY_NOM[(nom || "").toLowerCase()] || "neutral";
  }
  // Couleur de TEXTE lisible par theme (seriea/l2 sont trop clairs en base
  // pour du texte, cf. leur variante "-text" dediee) -- meme mapping que
  // index.html/ligues.html.
  const THEME_TEXT = {
    l1: "var(--mpg-league-l1)", pl: "var(--mpg-league-pl)", liga: "var(--mpg-league-liga)",
    seriea: "var(--mpg-league-seriea-text)", l2: "var(--mpg-league-l2-text)", ldc: "var(--mpg-league-ldc)",
    neutral: "var(--mpg-text-soft)",
  };
  const THEME_BAR = {
    l1: "var(--mpg-league-l1)", pl: "var(--mpg-league-pl)", liga: "var(--mpg-league-liga)",
    seriea: "var(--mpg-league-seriea)", l2: "var(--mpg-league-l2)", ldc: "var(--mpg-league-ldc)",
    neutral: "var(--mpg-text-off)",
  };

  async function loadLeagueOptions() {
    const { data, error } = await supabase
      .from("leagues")
      .select("nom, code, season_search, players_number, players_per_division")
      .order("nom");
    if (error || !data) return;

    leaguesByCode = Object.fromEntries(data.map(l => [l.code, l]));
    const select = document.getElementById("leagueCode");
    select.innerHTML = data.map(l => `<option value="${l.code}">${l.nom.replace(/_/g, " ")}</option>`).join("");

    const wantedCode = params.get("ligue");
    if (wantedCode && leaguesByCode[wantedCode]) select.value = wantedCode;

    populateDivisionOptions();
  }

  function populateDivisionOptions() {
    const league = leaguesByCode[document.getElementById("leagueCode").value];
    const divisionSelect = document.getElementById("division");
    if (!league) { divisionSelect.innerHTML = ""; return; }

    const totalDivisions = Math.round(league.players_number / league.players_per_division);
    const options = [];
    for (let d = 1; d <= totalDivisions; d++) options.push(`<option value="${d}">Division ${d}</option>`);
    divisionSelect.innerHTML = options.join("");

    const wantedDivision = params.get("division");
    if (wantedDivision && Number(wantedDivision) <= totalDivisions) divisionSelect.value = wantedDivision;
  }

  // Plus de bouton "Charger" (retour utilisateur 2026-08-24, "le bouton
  // Charger alourdit l'experience") -- chaque changement de selecteur
  // recharge instantanement. Au changement de LIGUE, si un manager est
  // choisi, re-resout SA division DANS CETTE ligue plutot que de retomber
  // sur la Division 1 par defaut (retour utilisateur 2026-08-25, "si je
  // change de competition ... il perd le manager et revient en D1
  // automatiquement").
  document.getElementById("leagueCode").addEventListener("change", async () => {
    populateDivisionOptions();
    const uid = document.getElementById("global-manager").value;
    if (uid) {
      const extra = await resolveManagerDivision(uid);
      if (extra.division && extra.ligue === document.getElementById("leagueCode").value) {
        document.getElementById("division").value = extra.division;
      }
    }
    load();
  });
  document.getElementById("division").addEventListener("change", load);
  // Retour utilisateur 2026-08-25, "bouton 'Ou suis-je ?' ... le tableau
  // defile jusqu'a la place du manager selectionne".
  document.getElementById("locate-btn").addEventListener("click", () => {
    document.querySelector(".mpg-row-selected")?.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  // Registre managers (retour utilisateur 2026-08-24, "on voit toujours un
  // nom d'equipe au lieu du realname") -- {userId: RealName}, charge une
  // seule fois. Pas dans `leagues`/`division_classement_live` : nom
  // d'equipe MPG et vrai nom de manager sont deux notions distinctes,
  // celle-ci vient de scripts/seed_managers.py (source locale MPG_Users.json,
  // aucun endpoint MPG n'expose le RealName directement).
  let realNameByUid = {};

  async function loadManagerNames() {
    const { data, error } = await supabase.from("managers").select("user_id, real_name");
    if (error || !data) return;
    realNameByUid = Object.fromEntries(data.map(m => [m.user_id, m.real_name]));
  }

  // Selecteur de manager global (bandeau, cf. mpg-tokens.css) -- retour
  // utilisateur 2026-08-25, "le choix du manager ... devrait rester fixe sur
  // toutes les pages ... placer les divisions du manager choisi". Meme
  // composant duplique sur chaque page (pas de module JS partage sur ce
  // site) -- localStorage + ?user= (URL prioritaire au premier chargement).
  const STORAGE_KEY = "mpg_live_user_id";

  async function initGlobalManagerSelector(resolveExtraParams) {
    const { data } = await supabase.from("managers").select("user_id, real_name").order("real_name");
    const select = document.getElementById("global-manager");
    select.innerHTML = `<option value="">— Manager —</option>`
      + (data || []).map(m => `<option value="${m.user_id}">${m.real_name}</option>`).join("");
    const wanted = params.get("user") || localStorage.getItem(STORAGE_KEY) || "";
    if (wanted) select.value = wanted;
    select.addEventListener("change", async () => {
      const uid = select.value;
      if (uid) localStorage.setItem(STORAGE_KEY, uid); else localStorage.removeItem(STORAGE_KEY);
      const url = new URL(location.href);
      if (uid) url.searchParams.set("user", uid); else url.searchParams.delete("user");
      if (uid && resolveExtraParams) {
        const extra = await resolveExtraParams(uid);
        for (const [k, v] of Object.entries(extra || {})) url.searchParams.set(k, v);
      }
      location.href = url.toString();
    });
    return wanted;
  }

  // Retrouve la/les division(s) ou joue ce manager (meme technique que
  // index.html "Mes ligues") -- garde la ligue courante si le manager y
  // figure, sinon prend la premiere trouvee. Utilise a la fois au
  // changement du selecteur global et au tout premier chargement de page.
  async function resolveManagerDivision(userId) {
    const currentLigue = document.getElementById("leagueCode").value;
    const { data } = await supabase.from("division_classement_live").select("league_code, division, data");
    const matches = (data || [])
      .map(row => ({ row, entry: (row.data || []).find(e => e.userId === userId) }))
      .filter(m => m.entry);
    if (!matches.length) return {};
    const keep = matches.find(m => m.row.league_code === currentLigue);
    const pick = keep || matches[0];
    return { ligue: pick.row.league_code, division: pick.row.division };
  }

  const BADGE_TONE = { cs: "success", manita: "fire", onFire: "amber", boss: "gold", pichichi: "violet", mur: "steel" };

  function fmt(n) {
    if (n === null || n === undefined) return "–";
    return Number.isInteger(n) ? String(n) : n.toFixed(1).replace(/\.0$/, "");
  }

  function badgeHtml(tone, label, value) {
    if (!value) return "";
    return `<span class="mpg-tag mpg-tag-${tone}">${label}${typeof value === "number" ? " " + fmt(value) : ""}</span>`;
  }

  function badgesFor(entry) {
    return `<span class="badges">
      ${badgeHtml(BADGE_TONE.cs, "CS", entry.cleanSheet)}
      ${badgeHtml(BADGE_TONE.manita, "Manita", entry.manita)}
      ${badgeHtml(BADGE_TONE.onFire, "En feu", entry.on_fire)}
      ${badgeHtml(BADGE_TONE.boss, "Boss", entry.boss)}
      ${badgeHtml(BADGE_TONE.pichichi, "Pichichi", entry.pichichi)}
      ${badgeHtml(BADGE_TONE.mur, "Mur", entry.mur)}
    </span>`;
  }

  function rowHtml(entry, isMe) {
    const played = entry.matches_joues ?? 0;
    return `
      <tr class="${isMe ? "mpg-row-selected" : ""}">
        <td class="rank" data-label="Rang">#${entry.rang}</td>
        <td class="team" data-label="Équipe">${realNameByUid[entry.userId] || entry.teamName || entry.userId}</td>
        <td class="num" data-label="Pts">${fmt(entry.points)}</td>
        <td class="num" data-label="J">${fmt(played)}</td>
        <td class="num" data-label="V">${fmt(entry.victoires)}</td>
        <td class="num" data-label="N">${fmt(entry.nuls)}</td>
        <td class="num" data-label="D">${fmt(entry.defaites)}</td>
        <td class="num" data-label="BP">${fmt(entry.buts_pour)}</td>
        <td class="num" data-label="BC">${fmt(entry.buts_contre)}</td>
        <td class="num" data-label="DG">${entry.diff > 0 ? "+" : ""}${fmt(entry.diff)}</td>
        <td data-label="Badges">${badgesFor(entry)}</td>
      </tr>`;
  }

  // "Resultats de la journee" -- retour utilisateur 2026-08-24, inspire de
  // l'onglet Divisions du site d'Ilan. Donnee deja captee par ailleurs
  // (live_snapshots, ecrite par scripts/live_job.py::poll_league a chaque
  // tick), juste pas encore affichee -- pas de nouvelle table necessaire.
  // Les noms d'equipe viennent de division_classement_live.data (deja
  // charge par load()), live_snapshots lui-meme n'a que userId/score.
  // Chaque ligne renvoie vers match.html (detail complet : compos, buts
  // reels/MPG/CSC, simulateur de bonus branche sur ce match precis) --
  // retour utilisateur 2026-08-24, "je dois pouvoir avoir acces aux
  // matchs + la possibilite des bonus, les buts MPG etc". Un seul userId
  // ancre suffit (?user=), simulate_api/app.py resout les DEUX equipes du
  // match a partir de lui.
  function matchRowHtml(match, teamNameByUserId, myUserId, leagueCode, division, gameWeek) {
    const homeName = realNameByUid[match.home.userId] || teamNameByUserId[match.home.userId] || match.home.userId;
    const awayName = realNameByUid[match.away.userId] || teamNameByUserId[match.away.userId] || match.away.userId;
    const isMe = match.home.userId === myUserId || match.away.userId === myUserId;
    const href = `match.html?ligue=${leagueCode}&division=${division}&gameweek=${gameWeek}&user=${match.home.userId}`;
    return `
      <a class="match-row${isMe ? " mpg-row-selected" : ""}" href="${href}">
        <div class="match-team">${match.home.userId === myUserId ? "★ " : ""}${homeName}</div>
        <div class="match-score">${fmt(match.home.score)} – ${fmt(match.away.score)}</div>
        <div class="match-team away">${awayName}${match.away.userId === myUserId ? " ★" : ""}</div>
      </a>`;
  }

  function matchesHtml(matches, teamNameByUserId, myUserId, leagueCode, division, gameWeek) {
    if (!matches.length) return "";
    return `
      <div class="matches-card">
        <h2>Résultats de la journée</h2>
        ${matches.map(m => matchRowHtml(m, teamNameByUserId, myUserId, leagueCode, division, gameWeek)).join("")}
      </div>`;
  }

  function situationHtml(entry) {
    if (!entry) return "";
    return `
      <div class="situation-card">
        <h2>Ma situation</h2>
        <div class="situation-grid">
          <div class="situation-item"><div class="value">#${entry.rang}</div><div class="label">Rang de division</div></div>
          <div class="situation-item"><div class="value">${entry.rang_ligue != null ? "#" + entry.rang_ligue : "–"}</div><div class="label">Rang de ligue</div></div>
          <div class="situation-item"><div class="value">${fmt(entry.points_ligue)}</div><div class="label">Points (ligue)</div></div>
        </div>
        <p class="situation-note">Rang de ligue/points calculés sur la formule officielle (Pichichi, Mur, Boss, CS, Manita, En feu, Précieux, Grotaldo). Précieux compte seulement une fois la journée archivée.</p>
      </div>`;
  }

  // "Toutes mes divisions" -- retour utilisateur 2026-08-25, "Quand je vais
  // sur division, je veux que toutes les ligues actives s'affichent" : par
  // defaut (manager choisi, aucun ?ligue= explicite dans l'URL), affiche
  // TOUTES les divisions ou joue ce manager (meme technique que "Mes
  // ligues" sur index.html), chacune dans un expander avec son classement
  // complet + ses resultats de journee -- pas le simulateur (deja couvert
  // par site/simulations.html, qui se concentre sur les divisions EN
  // DIRECT). Choisir manuellement une Ligue/Division dans les selecteurs
  // bascule sur la vue mono-division existante (cf. load()).
  function showAllMode() {
    document.getElementById("all-status").style.display = "";
    document.getElementById("all-divisions").style.display = "";
    document.getElementById("single-division-view").style.display = "none";
  }
  function showSingleMode() {
    document.getElementById("all-status").style.display = "none";
    document.getElementById("all-divisions").style.display = "none";
    document.getElementById("single-division-view").style.display = "";
  }

  function divisionExpanderHtml(row, league, userId) {
    const theme = leagueTheme(league && league.nom);
    const name = league ? league.nom.replace(/_/g, " ") : row.league_code;
    const statusColor = row.is_live ? "var(--mpg-warning)" : "var(--mpg-success)";
    const statusLabel = row.is_live ? "en cours" : "terminée";
    const entries = row.data || [];
    const blockId = `div-block-${row.league_code}-${row.division}`;
    return `
      <details class="division-expander"${row.is_live ? " open" : ""}>
        <summary>
          <span class="summary-dot" style="background:${THEME_BAR[theme]}"></span>
          <span class="summary-league" style="color:${THEME_TEXT[theme]}">${name}</span>
          <span class="summary-division">Division ${row.division} · Journée ${row.game_week}</span>
          <span class="summary-status" style="color:${statusColor}">${statusLabel}</span>
        </summary>
        <div class="expander-body">
          <div class="table-wrap">
            <table class="mpg-table mpg-head-${theme}">
              <thead><tr>
                <th>Rang</th><th>Équipe</th><th>Pts</th><th>J</th><th>V</th><th>N</th><th>D</th>
                <th>BP</th><th>BC</th><th>DG</th><th>Badges</th>
              </tr></thead>
              <tbody>${entries.map(e => rowHtml(e, userId && e.userId === userId)).join("")}</tbody>
            </table>
          </div>
          <div id="${blockId}"></div>
        </div>
      </details>`;
  }

  async function loadAllMyDivisions(userId) {
    showAllMode();
    const allStatusEl = document.getElementById("all-status");
    const allEl = document.getElementById("all-divisions");
    const subtitleEl = document.getElementById("subtitle");
    subtitleEl.textContent = "Toutes tes divisions, toutes ligues confondues.";
    allStatusEl.textContent = "Chargement...";
    allStatusEl.className = "status-msg";
    allEl.innerHTML = "";

    const { data: divData, error } = await supabase.from("division_classement_live").select("*");
    if (error) {
      allStatusEl.textContent = "Erreur : " + error.message;
      allStatusEl.className = "status-msg err";
      return;
    }

    const myRows = (divData || []).filter(row => (row.data || []).some(e => e.userId === userId));
    if (!myRows.length) {
      allStatusEl.textContent = "Aucune division trouvée pour ce manager (saison pas encore pollée).";
      return;
    }
    myRows.sort((a, b) => (b.is_live - a.is_live) || a.league_code.localeCompare(b.league_code));

    allStatusEl.textContent = "";
    allEl.innerHTML = myRows.map(row => divisionExpanderHtml(row, leaguesByCode[row.league_code], userId)).join("");

    await Promise.all(myRows.map(async row => {
      const league = leaguesByCode[row.league_code];
      if (!league) return;
      const { data: snapshotRows } = await supabase
        .from("live_snapshots")
        .select("data")
        .eq("league_code", row.league_code)
        .eq("season", league.season_search)
        .eq("division", row.division)
        .eq("game_week", row.game_week)
        .limit(1);
      const matches = (snapshotRows && snapshotRows[0] && snapshotRows[0].data) || [];
      const entries = row.data || [];
      const teamNameByUserId = Object.fromEntries(entries.map(e => [e.userId, e.teamName]));
      const blockEl = document.getElementById(`div-block-${row.league_code}-${row.division}`);
      if (blockEl) blockEl.innerHTML = matchesHtml(matches, teamNameByUserId, userId, row.league_code, row.division, row.game_week);
    }));
  }

  async function load() {
    showSingleMode();
    const leagueCode = document.getElementById("leagueCode").value;
    const league = leaguesByCode[leagueCode];
    const division = Number(document.getElementById("division").value);

    const statusEl = document.getElementById("status");
    const subtitleEl = document.getElementById("subtitle");
    const situationEl = document.getElementById("situation");
    const tableEl = document.getElementById("table-container");
    const matchesEl = document.getElementById("matches");
    const backEl = document.getElementById("back-to-all");
    const currentUserId = document.getElementById("global-manager").value;
    backEl.innerHTML = currentUserId ? `<a href="division.html?user=${currentUserId}">&larr; Toutes mes divisions</a>` : "";

    if (!league) { statusEl.textContent = "Choisis une ligue."; return; }

    statusEl.textContent = "Chargement...";
    statusEl.className = "status-msg";
    situationEl.innerHTML = "";
    tableEl.innerHTML = "";
    matchesEl.innerHTML = "";

    const { data, error } = await supabase
      .from("division_classement_live")
      .select("*")
      .eq("league_code", leagueCode)
      .eq("season", league.season_search)
      .eq("division", division)
      .limit(1);

    if (error) {
      statusEl.textContent = "Erreur : " + error.message;
      statusEl.className = "status-msg err";
      subtitleEl.textContent = "";
      return;
    }
    if (!data.length) {
      statusEl.textContent = "Aucun classement pour cette ligue/division (jamais suivie, ou journée pas encore pollée).";
      subtitleEl.textContent = "";
      return;
    }

    const row = data[0];
    statusEl.textContent = "";
    subtitleEl.innerHTML = `${league.nom.replace(/_/g, " ")} · Journée ${row.game_week} · `
      + `<span style="color:${row.is_live ? "var(--mpg-warning)" : "var(--mpg-success)"}">${row.is_live ? "en cours" : "terminée"}</span>`
      + ` · mis à jour ${new Date(row.updated_at).toLocaleString("fr-FR")}`;

    const entries = row.data || [];
    const userId = document.getElementById("global-manager").value;
    const myEntry = userId ? entries.find(e => e.userId === userId) : null;
    situationEl.innerHTML = situationHtml(myEntry);

    tableEl.innerHTML = `
      <div class="table-wrap">
        <table class="mpg-table mpg-head-${leagueTheme(league.nom)}">
          <thead><tr>
            <th>Rang</th><th>Équipe</th><th>Pts</th><th>J</th><th>V</th><th>N</th><th>D</th>
            <th>BP</th><th>BC</th><th>DG</th><th>Badges</th>
          </tr></thead>
          <tbody>${entries.map(e => rowHtml(e, userId && e.userId === userId)).join("")}</tbody>
        </table>
      </div>`;

    const { data: snapshotRows } = await supabase
      .from("live_snapshots")
      .select("data")
      .eq("league_code", leagueCode)
      .eq("season", league.season_search)
      .eq("division", division)
      .eq("game_week", row.game_week)
      .limit(1);
    const matches = (snapshotRows && snapshotRows[0] && snapshotRows[0].data) || [];
    const teamNameByUserId = Object.fromEntries(entries.map(e => [e.userId, e.teamName]));
    matchesEl.innerHTML = matchesHtml(matches, teamNameByUserId, userId, leagueCode, division, row.game_week);
  }

  await Promise.all([loadLeagueOptions(), loadManagerNames()]);
  // Pas de resolveManagerDivision ici (contrairement au changement de
  // #global-manager -- cf. plus bas) : le choix par defaut est desormais
  // "toutes mes divisions" (loadAllMyDivisions), pas un saut automatique
  // vers UNE seule.
  const globalUserId = await initGlobalManagerSelector();

  // Au tout premier chargement : manager choisi (localStorage/?user=) mais
  // aucune ligue/division explicite dans l'URL -> vue "toutes mes
  // divisions" par defaut (retour utilisateur 2026-08-25, "je veux que
  // toutes les ligues actives s'affichent"). Un lien ?ligue=&division=
  // explicite (ex. depuis "Mes ligues" sur index.html) garde le
  // comportement mono-division existant.
  if (globalUserId && !params.get("ligue")) {
    await loadAllMyDivisions(globalUserId);
  } else {
    load();
  }
</script>
