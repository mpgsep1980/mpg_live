<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPG Live -- Live</title>
<link rel="stylesheet" href="mpg-tokens.css">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: var(--mpg-title); }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .meta { color: var(--mpg-text-soft); font-size: 0.85rem; }

  /* --- Expanders (une division en direct = un <details>) --- */
  .match-expander {
    border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius); margin: 0.75rem 0; overflow: hidden;
  }
  .match-expander summary {
    display: flex; align-items: center; gap: 0.6rem; padding: 0.85rem 1.1rem; cursor: pointer;
    list-style: none; font-size: 0.95rem;
  }
  .match-expander summary::-webkit-details-marker { display: none; }
  .match-expander summary::before { content: "▸"; color: var(--mpg-text-off); transition: transform 150ms ease; }
  .match-expander[open] summary::before { transform: rotate(90deg); }
  .summary-dot { width: 0.6rem; height: 0.6rem; border-radius: 999px; flex-shrink: 0; }
  .summary-league { font-weight: 700; }
  .summary-division { color: var(--mpg-text-soft); font-size: 0.85rem; }
  .summary-score { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .expander-body { padding: 0 1.1rem 1.1rem; border-top: 0.5px solid var(--mpg-border-soft); }

  /* --- En-tete du match --- */
  /* Retour utilisateur 2026-08-27, "header non centre" -- une bande pleine
     largeur avec deux noms de club courts et un score au milieu se lit mal
     (beaucoup de vide de chaque cote). Carte compacte, largeur bornee et
     centree explicitement plutot qu'etiree sur toute la largeur de page. */
  .match-header {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: center;
    border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius); padding: 1rem 1.25rem;
    max-width: 26rem; margin: 1rem auto;
  }
  .match-header .team-name { font-weight: 700; font-size: 1.05rem; }
  .match-header .team.away { text-align: right; }
  .match-header .score { font-size: 1.6rem; font-weight: 700; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .match-header .meta { text-align: center; }

  /* --- Compositions -- mise en page entrelacee par ligne de poste (G/D/M/A),
     meme traitement que site/match.html (retour utilisateur 2026-08-27,
     "tu as retire tout ce qu'on avait fait concernant les couleurs, les
     moyennes par lignes, le retrait du bouton Simuler" -- cette page n'avait
     jamais recu ces correctifs, portes ici a l'identique). --mpg-success/
     --mpg-warning/--mpg-danger reutilises tels quels pour que la barre
     "chances de resultat" (cf. oddsBarHtml) partage la meme echelle. */
  .lineups-card { border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius); padding: 1rem 1.25rem; margin: 1rem 0; }
  .comp-teams { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .comp-team-name { font-weight: 700; font-size: 1rem; }
  .comp-team-name.away { text-align: right; }

  .position-block { margin-top: 0.5rem; }
  .position-label {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--mpg-text-soft); text-align: center; margin: 0.6rem 0 0.35rem;
    border-top: 0.5px solid var(--mpg-border-soft); padding-top: 0.5rem;
  }
  .position-label.line-avg-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0.4rem; }
  .line-avg { font-weight: 700; color: var(--mpg-warning); font-variant-numeric: tabular-nums; font-size: 1rem; text-transform: none; }

  .player-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0.4rem; padding: 0.15rem 0; }
  .player { display: flex; align-items: center; gap: 0.4rem; min-width: 0; }
  .player.away { flex-direction: row-reverse; text-align: right; }
  .player-name { font-size: 0.82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sep { text-align: center; color: var(--mpg-border-soft); font-size: 0.82rem; }
  .replaced-note { display: block; font-size: 0.72rem; color: var(--mpg-text-soft); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .note-badge {
    flex: none; width: 1.7rem; height: 1.7rem; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 700; color: #fff;
    font-variant-numeric: tabular-nums; position: relative;
  }
  .note-badge.note-high { background: var(--mpg-success); }
  .note-badge.note-mid { background: var(--mpg-warning); }
  .note-badge.note-low { background: var(--mpg-danger); }
  .note-badge.note-none { background: var(--mpg-border-soft); color: var(--mpg-text-soft); }
  /* Aura : QUI a beneficie/subi un effet de bonus dans ce scenario simule --
     doree = touche par un boost (Zahia/McDo+), rouge = touche par un nerf
     (Suarez/Cheat Code). */
  .note-badge.aura-boost { box-shadow: 0 0 0 2px var(--mpg-surface, #fff), 0 0 0 4px var(--mpg-warning), 0 0 7px 2px var(--mpg-warning); }
  .note-badge.aura-nerf { box-shadow: 0 0 0 2px var(--mpg-surface, #fff), 0 0 0 4px var(--mpg-danger), 0 0 7px 2px var(--mpg-danger); }
  .captain-flag {
    position: absolute; top: -0.25rem; right: -0.25rem; width: 0.85rem; height: 0.85rem;
    border-radius: 50%; background: #2b6fd1; color: #fff; font-size: 0.55rem;
    display: flex; align-items: center; justify-content: center; font-weight: 800;
    border: 1px solid var(--mpg-surface, #fff);
  }
  .goal-flag {
    position: absolute; bottom: -0.25rem; right: -0.25rem; width: 0.8rem; height: 0.8rem;
    border-radius: 50%; background: var(--mpg-success); border: 1px solid var(--mpg-surface, #fff);
  }
  .real-goal-flag {
    position: absolute; bottom: -0.25rem; left: -0.25rem; width: 0.8rem; height: 0.8rem;
    border-radius: 50%; background: var(--mpg-title); border: 1px solid var(--mpg-surface, #fff);
  }
  /* CSC classique (retour utilisateur 2026-08-27, "qui marque ce CSC ...
     pas de point jaune sur le joueur") -- coin haut-gauche (les 3 autres
     coins sont deja pris par capitaine/but MPG/but reel), meme jaune que
     .ball.real_og (#e0b400) pour rester coherent avec la liste "Buts". */
  .csc-flag {
    position: absolute; top: -0.25rem; left: -0.25rem; width: 0.8rem; height: 0.8rem;
    border-radius: 50%; background: #e0b400; border: 1px solid var(--mpg-surface, #fff);
  }

  .scorers-block { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.5rem; }
  .scorer-row { display: flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; min-width: 0; }
  .scorer-row span:not(.ball):not(.scorer-time) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scorers-col.away .scorer-row { flex-direction: row-reverse; }
  .ball {
    flex: none; display: inline-block; vertical-align: middle;
    width: 0.5rem; height: 0.5rem; border-radius: 50%; margin: 0 0.15rem;
  }
  /* Points de but : noir = but normal (reel), vert = but MPG (duel de
     lignes), rouge = CSC Rotaldo, jaune = CSC classique -- #e0b400 reprend
     exactement la teinte de la reference admin/manager.html. */
  .ball.real { background: var(--mpg-title); }
  .ball.mpg { background: var(--mpg-success); }
  .ball.csc { background: var(--mpg-danger); }
  .ball.real_og { background: #e0b400; }
  .scorer-time { color: var(--mpg-text-soft); font-size: 0.75rem; flex: none; }
  /* Badge de seuil sur "Joueurs sortis" -- meme composant que .note-badge
     (colore via noteClass, comme une vraie note), juste plus petit. */
  .note-badge.threshold-badge {
    display: inline-flex; width: 1.3rem; height: 1.3rem; font-size: 0.6rem;
    vertical-align: middle; margin-left: 0.3rem;
  }
  .no-scorer { color: var(--mpg-text-soft); font-size: 0.78rem; font-style: italic; }

  @media (max-width: 640px) {
    .player-name { font-size: 0.76rem; }
    .note-badge { width: 1.5rem; height: 1.5rem; font-size: 0.65rem; }
  }

  /* --- Simulateur --- */
  .sim-card { border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius); padding: 1rem 1.25rem; margin: 1rem 0; }
  .sim-card h2 { margin: 0 0 0.25rem; font-size: 1rem; }
  .sim-card .meta { margin: 0 0 0.75rem; }
  .sim-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end; margin-bottom: 0.75rem; }
  .sim-row label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.75rem; color: var(--mpg-text-soft); }
  .sim-row select, .sim-row input {
    border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius); padding: 0.4rem 0.5rem;
    font-size: 0.9rem; font-family: inherit; color: var(--mpg-title); background: var(--mpg-surface, #fff);
  }
  .sim-result { display: flex; gap: 2rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .sim-result .side { text-align: center; }
  .sim-result .side.me .total { color: var(--mpg-action); }
  .sim-result .total { font-size: 1.6rem; font-weight: 700; }
  .sim-result .label { font-size: 0.75rem; color: var(--mpg-text-soft); }

  .sim-classement { display: flex; gap: 1.75rem; flex-wrap: wrap; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px dashed var(--mpg-border-soft); }
  .sim-classement .item { text-align: center; min-width: 6rem; }
  .sim-classement .item .rang { font-size: 1.3rem; font-weight: 700; }
  .sim-classement .item .rang .of { font-size: 0.8rem; font-weight: 400; color: var(--mpg-text-soft); }
  .sim-classement .item .rang .delta { font-size: 0.72rem; font-weight: 600; margin-left: 0.2rem; }
  .sim-classement .item .rang .delta.up { color: var(--mpg-success); }
  .sim-classement .item .rang .delta.down { color: var(--mpg-danger); }
  .sim-classement .item .label { font-size: 0.72rem; color: var(--mpg-text-soft); text-transform: uppercase; letter-spacing: 0.02em; }
  .sweep-bad { color: var(--mpg-danger); font-weight: 600; }
  .sweep-baseline td { font-weight: 700; background: var(--mpg-action-soft, rgba(0,0,0,0.03)); border-bottom: 2px solid var(--mpg-border-soft); }

  .status-msg { color: var(--mpg-text-soft); font-size: 0.9rem; margin: 1rem 0; }
  .status-msg.err { color: var(--mpg-danger); }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>

<header class="mpg-banner mpg-no-print">
  <div class="mpg-banner-inner">
    <a class="mpg-banner-title" href="index.html">MPG part en LIVE</a>
    <nav class="mpg-banner-nav">
      <a class="mpg-banner-item" href="index.html">Accueil</a>
      <a class="mpg-banner-item" href="simulations.html">Live</a>
    </nav>
    <label class="mpg-banner-manager mpg-no-print">
      <select id="global-manager"><option value="">— Manager —</option></select>
    </label>
  </div>
</header>
<script>
  for (const a of document.querySelectorAll(".mpg-banner-item")) {
    if (a.pathname === location.pathname) a.classList.add("is-active");
  }
</script>

<h1>Live</h1>
<div class="meta">Toutes tes divisions dont la journée est en cours, en une seule fois -- ta place en division, en ligue et au Super Classement, mise à jour à chaque tick et par tes propres simulations de bonus.</div>

<div id="status" class="status-msg">Chargement...</div>
<div id="list"></div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL = "https://zvmngpoogwjiknqrkjky.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_YhAD0_spZJF58Dt_TTQplQ_VrFSKRK8";
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const params = new URLSearchParams(location.search);

  // Retour utilisateur 2026-08-25 : "il faudrait que toutes les divisions en
  // cours soient disponibles, quitte a mettre des expanders ... pouvoir
  // faire toutes les simulations pour tester a quelle place on serait
  // potentiellement au classement de sa ligue, au general". Agrege le
  // simulateur complet (score/detail/classement projete, cf. match.html)
  // sur TOUTES les divisions en direct du manager choisi.
  const STORAGE_KEY = "mpg_live_user_id";

  async function initGlobalManagerSelector() {
    const { data } = await supabase.from("managers").select("user_id, real_name").order("real_name");
    const select = document.getElementById("global-manager");
    select.innerHTML = `<option value="">— Manager —</option>`
      + (data || []).map(m => `<option value="${m.user_id}">${m.real_name}</option>`).join("");
    const wanted = params.get("user") || localStorage.getItem(STORAGE_KEY) || "";
    if (wanted) select.value = wanted;
    select.addEventListener("change", () => {
      const uid = select.value;
      if (uid) localStorage.setItem(STORAGE_KEY, uid); else localStorage.removeItem(STORAGE_KEY);
      const url = new URL(location.href);
      if (uid) url.searchParams.set("user", uid); else url.searchParams.delete("user");
      location.href = url.toString();
    });
    return wanted;
  }

  // Meme mapping que index.html/division.html/ligue.html.
  const LEAGUE_THEME_BY_NOM = {
    "ligue_camembert": "l1",
    "rosbeef_league": "pl",
    "liga_tapas": "liga",
    "lega_calzone": "seriea",
    "ligue_2_ekt": "l2",
    "ligue_des_champignons": "ldc",
  };
  const THEME_BAR = {
    l1: "var(--mpg-league-l1)", pl: "var(--mpg-league-pl)", liga: "var(--mpg-league-liga)",
    seriea: "var(--mpg-league-seriea)", l2: "var(--mpg-league-l2)", ldc: "var(--mpg-league-ldc)",
    neutral: "var(--mpg-text-off)",
  };
  const THEME_TEXT = {
    l1: "var(--mpg-league-l1)", pl: "var(--mpg-league-pl)", liga: "var(--mpg-league-liga)",
    seriea: "var(--mpg-league-seriea-text)", l2: "var(--mpg-league-l2-text)", ldc: "var(--mpg-league-ldc)",
    neutral: "var(--mpg-text-soft)",
  };
  function leagueTheme(nom) {
    return LEAGUE_THEME_BY_NOM[(nom || "").toLowerCase()] || "neutral";
  }

  const SIMULATE_API_BASE = "https://mpg-live.onrender.com";

  const BONUS_OPTIONS = [
    { value: "", label: "Aucun" },
    { value: "boostAllPlayers", label: "Zahia (+0,5 à tous)" },
    { value: "boostOnePlayer", label: "McDo+ (+1 à un titu)" },
    { value: "nerfGoalkeeper", label: "Suarez (-1 gardien)" },
    { value: "nerfAllPlayers", label: "Cheat Code (-0,5 adverses)" },
    { value: "blockTacticalSubs", label: "Tonton Pat' (bloque tactiques adv.)" },
    { value: "removeGoal", label: "Valise à Nanard (annule 1 but adv.)" },
    { value: "mirror", label: "Miroir (renvoie/vole le coup adv.)" },
  ];
  const BONUS_MIN_DIVISION_SIZE = {
    removeGoal: 4, boostOnePlayer: 4,
    nerfGoalkeeper: 6, boostAllPlayers: 6, mirror: 6,
    nerfAllPlayers: 8, blockTacticalSubs: 8,
  };
  const BONUS_NEEDS_TARGET = new Set(["boostOnePlayer"]);

  function bonusOptionsForDivisionSize(divisionSize) {
    return BONUS_OPTIONS.filter(o => !o.value || divisionSize >= (BONUS_MIN_DIVISION_SIZE[o.value] || 0));
  }
  function optionsHtml(options, selectedValue) {
    return options.map(o => `<option value="${o.value}"${o.value === (selectedValue || "") ? " selected" : ""}>${o.label}</option>`).join("");
  }
  function targetOptionsHtml(list, selectedId) {
    return list.map(p => `<option value="${p.id}"${p.id === selectedId ? " selected" : ""}>${p.name}</option>`).join("");
  }
  // "sim-target-player" est une CLASSE ici, pas un id -- plusieurs blocs
  // (un par division en direct) coexistent sur la meme page, cf.
  // createBlockController ci-dessous qui scope toutes ses recherches DOM
  // via root.querySelector(".xxx") plutot que document.getElementById.
  // Exclut les remplacants entres (replaced_starter renseigne) -- meme
  // correctif que simulate_api/app.py::live_scenario_sweep et
  // site/match.html : un manager choisit sa cible McDo+ AVANT le coup
  // d'envoi, seul le titulaire DECLARE a ce moment-la est une cible
  // plausible.
  function targetSelectHtml(myTeam, selectedId, hidden) {
    const players = Object.entries(myTeam.players || {})
      .filter(([, p]) => p.position !== 1 && !p.replaced_starter)
      .map(([id, p]) => ({ id, name: p.name }));
    const outPlayers = (myTeam.out || [])
      .filter(p => p.is_default_rating)
      .map(p => ({ id: p.playerId, name: p.name }));
    const outGroup = outPlayers.length
      ? `<optgroup label="Déjà remplacés (vrai match pas encore joué)">${targetOptionsHtml(outPlayers, selectedId)}</optgroup>`
      : "";
    return `<select class="sim-target-player" style="${hidden ? "display:none" : ""}"><option value="">— choisir le titu —</option>${targetOptionsHtml(players, selectedId)}${outGroup}</select>`;
  }

  function fmt(n) {
    if (n === null || n === undefined) return "–";
    return Number.isInteger(n) ? String(n) : n.toFixed(1).replace(/\.0$/, "");
  }

  const POSITION_LABEL = { 1: "G", 2: "D", 3: "M", 4: "A" };

  // Memes 3 paliers que admin/manager.html (>=6 vert, >=4.5 or, sinon
  // rouge), meme logique d'aura (BOOST_TAGS -> doree, NERF_TAGS -> rouge,
  // cf. core/live_scoring.py qui pose deja p["bonus_tag"] sur chaque
  // joueur touche par un effet simule).
  function noteClass(note) {
    if (note === null || note === undefined) return "note-none";
    if (note >= 6) return "note-high";
    if (note >= 4.5) return "note-mid";
    return "note-low";
  }
  const BONUS_TAG_LABELS = {
    boostAllPlayers: "Zahia (+0,5)", boostOnePlayer: "McDo+ (+1)",
    nerfGoalkeeper: "Suarez (-1)", nerfAllPlayers: "Cheat Code (-0,5)",
  };
  const BOOST_TAGS = new Set(["boostAllPlayers", "boostOnePlayer"]);
  const NERF_TAGS = new Set(["nerfGoalkeeper", "nerfAllPlayers"]);

  function playerBadge(p, isCaptain) {
    const note = p.effective_note;
    const cls = noteClass(note);
    const noteText = fmt(note);
    const mpgGoalFlag = p.but_mpg_bonus ? `<span class="goal-flag" title="But MPG"></span>` : "";
    const realGoalFlag = p.real_goals > 0 ? `<span class="real-goal-flag" title="But réel"></span>` : "";
    // CSC classique (retour utilisateur 2026-08-27, "qui marque ce CSC pour
    // mon adversaire, pas de point jaune sur le joueur") -- real_own_goal_
    // scored_events est deja calcule cote serveur (compute_player_live_score)
    // pour CHAQUE joueur, jamais affiche sur le badge jusqu'ici (seulement
    // dans la liste "Buts", via goal_events, cote de l'equipe BENEFICIAIRE).
    const cscFlag = (p.real_own_goal_scored_events || []).length > 0 ? `<span class="csc-flag" title="CSC (contre son camp)"></span>` : "";
    const auraCls = BOOST_TAGS.has(p.bonus_tag) ? " aura-boost" : NERF_TAGS.has(p.bonus_tag) ? " aura-nerf" : "";
    const title = p.bonus_tag ? ` title="${BONUS_TAG_LABELS[p.bonus_tag] || p.bonus_tag}"` : "";
    return `<div class="note-badge ${cls}${auraCls}"${title}>${noteText}${isCaptain ? `<span class="captain-flag">C</span>` : ""}${mpgGoalFlag}${realGoalFlag}${cscFlag}</div>`;
  }

  function benchBadge(p) {
    const cls = noteClass(p.note_finale);
    return `<div class="note-badge ${cls}">${fmt(p.note_finale)}</div>`;
  }

  function playersByPosition(team) {
    const groups = { 1: [], 2: [], 3: [], 4: [] };
    Object.entries(team.players || {}).forEach(([playerId, p]) => {
      if (groups[p.position]) groups[p.position].push({ ...p, playerId });
    });
    return groups;
  }

  function lineAvgText(team, pos) {
    const avg = (team.line_averages || {})[pos];
    return avg === null || avg === undefined ? null : fmt(avg);
  }

  function positionLabelHtml(pos, homeTeam, awayTeam) {
    const homeAvg = lineAvgText(homeTeam, pos);
    const awayAvg = lineAvgText(awayTeam, pos);
    if (homeAvg === null && awayAvg === null) {
      return `<div class="position-label">${POSITION_LABEL[pos]}</div>`;
    }
    return `
      <div class="position-label line-avg-row">
        <span class="line-avg">${homeAvg ?? ""}</span>
        <span>${POSITION_LABEL[pos]} &middot; moy. ligne</span>
        <span class="line-avg">${awayAvg ?? ""}</span>
      </div>`;
  }

  function playersHtml(match) {
    const homeGroups = playersByPosition(match.home);
    const awayGroups = playersByPosition(match.away);
    const homeCaptainId = Object.keys(match.home.players || {}).find(id => match.home.players[id].bonus_capitaine > 0);
    const awayCaptainId = Object.keys(match.away.players || {}).find(id => match.away.players[id].bonus_capitaine > 0);

    return [1, 2, 3, 4].map(pos => {
      const homeList = homeGroups[pos], awayList = awayGroups[pos];
      const maxRows = Math.max(homeList.length, awayList.length);
      let rows = "";
      for (let i = 0; i < maxRows; i++) {
        const hp = homeList[i], ap = awayList[i];
        rows += `
          <div class="player-row">
            <div class="player">
              ${hp ? playerBadge(hp, hp.playerId === homeCaptainId) : ""}
              <span class="player-name">${hp ? hp.name : ""}${hp && hp.replaced_starter ? `<span class="replaced-note">&#8618; remplace ${hp.replaced_starter}</span>` : ""}</span>
            </div>
            <div class="row-sep">&middot;</div>
            <div class="player away">
              ${ap ? playerBadge(ap, ap.playerId === awayCaptainId) : ""}
              <span class="player-name">${ap ? ap.name : ""}${ap && ap.replaced_starter ? `<span class="replaced-note">&#8618; remplace ${ap.replaced_starter}</span>` : ""}</span>
            </div>
          </div>`;
      }
      return `<div class="position-block">${positionLabelHtml(pos, match.home, match.away)}${rows}</div>`;
    }).join("");
  }

  // "Joueurs sortis" -- titulaires D'ORIGINE reellement sortis
  // (core/live_scoring.py, champ "out"), categorie a part de "Titulaires".
  const OUT_REASON_LABELS = { tactique: "tactique", obligatoire: "obligatoire" };

  function outBadge(p) {
    return `<div class="note-badge ${noteClass(p.note_finale)}">${fmt(p.note_finale)}</div>`;
  }

  function outRowHtml(p) {
    if (!p) return { badge: "", name: "" };
    let thresholdBadge = "";
    if (p.seuil_configure !== undefined && p.seuil_configure !== null) {
      thresholdBadge = `<span class="note-badge threshold-badge ${noteClass(p.seuil_configure)}" title="Seuil de remplacement configure">&lt;${fmt(p.seuil_configure)}</span>`;
    }
    const reason = OUT_REASON_LABELS[p.reason] || p.reason;
    const bonusDiffers = (p.note_avec_bonus !== undefined && p.note_avec_bonus !== p.note_finale)
      || (p.note_seuil !== undefined && p.note_seuil !== p.note_finale);
    const bonusDetail = bonusDiffers
      ? `<span class="replaced-note">bonus : ${fmt(p.note_avec_bonus)} &middot; note comparee au seuil : ${fmt(p.note_seuil)}</span>`
      : "";
    return {
      badge: outBadge(p),
      name: `${p.name}<span class="replaced-note">&rarr; ${p.replaced_by} (${reason})${thresholdBadge}</span>${bonusDetail}`,
    };
  }

  function outBlockHtml(home, away) {
    const homeOut = home.out || [];
    const awayOut = away.out || [];
    if (!homeOut.length && !awayOut.length) {
      return `<div class="position-block"><div class="position-label">Joueurs sortis</div><div class="no-scorer" style="text-align:center; padding:0.25rem 0;">Aucun remplacement effectif pour l'instant</div></div>`;
    }
    const maxRows = Math.max(homeOut.length, awayOut.length);
    let rows = "";
    for (let i = 0; i < maxRows; i++) {
      const hp = outRowHtml(homeOut[i]), ap = outRowHtml(awayOut[i]);
      rows += `
        <div class="player-row">
          <div class="player">${hp.badge}<span class="player-name">${hp.name}</span></div>
          <div class="row-sep">&middot;</div>
          <div class="player away">${ap.badge}<span class="player-name">${ap.name}</span></div>
        </div>`;
    }
    return `<div class="position-block"><div class="position-label">Joueurs sortis</div>${rows}</div>`;
  }

  function benchBlockHtml(home, away) {
    const homeBench = (home.bench || []).filter(p => !p.entered);
    const awayBench = (away.bench || []).filter(p => !p.entered);
    if (!homeBench.length && !awayBench.length) return "";
    const maxRows = Math.max(homeBench.length, awayBench.length);
    let rows = "";
    for (let i = 0; i < maxRows; i++) {
      const hp = homeBench[i], ap = awayBench[i];
      rows += `
        <div class="player-row">
          <div class="player">${hp ? benchBadge(hp) : ""}<span class="player-name">${hp ? hp.name : ""}</span></div>
          <div class="row-sep">&middot;</div>
          <div class="player away">${ap ? benchBadge(ap) : ""}<span class="player-name">${ap ? ap.name : ""}</span></div>
        </div>`;
    }
    return `<div class="position-block"><div class="position-label">Remplaçants non entrés</div>${rows}</div>`;
  }

  // Feuille de but UNIFIEE et triee chronologiquement -- reel, MPG (duel de
  // lignes), CSC classique (or) et CSC Rotaldo (rouge) se melangent dans la
  // MEME liste, distingues par la couleur du point.
  function scorersHtml(team) {
    const events = team.goal_events || [];
    if (!events.length) return `<div class="no-scorer">—</div>`;
    const sorted = [...events].sort((a, b) => (a.time ? parseInt(a.time) : 999) - (b.time ? parseInt(b.time) : 999));
    return sorted.map(ev => `
      <div class="scorer-row">
        <span class="ball ${ev.type}"></span>
        <span>${ev.name}</span>
        ${ev.time ? `<span class="scorer-time">${ev.time}</span>` : ""}
      </div>`).join("");
  }

  function compositionsHtml(match, homeName, awayName) {
    return `
      <div class="lineups-card">
        <div class="comp-teams">
          <div class="comp-team-name">${homeName}</div>
          <div class="comp-team-name away">${awayName}</div>
        </div>
        ${playersHtml(match)}
        ${outBlockHtml(match.home, match.away)}
        ${benchBlockHtml(match.home, match.away)}
        <div class="position-label">Buts</div>
        <div class="scorers-block">
          <div class="scorers-col">${scorersHtml(match.home)}</div>
          <div class="scorers-col away">${scorersHtml(match.away)}</div>
        </div>
      </div>`;
  }

  function matchHeaderHtml(match, homeName, awayName, gameWeek, simulated) {
    // `simulated` : distingue le score REEL (chargement initial) du score
    // recalcule apres un coup simule -- sans ca, rien ne signale que ce
    // nombre en gros n'est plus le resultat MPG officiel.
    const meta = simulated ? `Journée ${gameWeek} · <em>scénario simulé</em>` : `Journée ${gameWeek}`;
    return `
      <div class="match-header">
        <div class="team home"><div class="team-name">${homeName}</div></div>
        <div>
          <div class="score">${fmt(match.home.score)} – ${fmt(match.away.score)}</div>
          <div class="meta">${meta}</div>
        </div>
        <div class="team away"><div class="team-name">${awayName}</div></div>
      </div>`;
  }

  function simResultHtml(match, myUserId) {
    const meIsHome = match.home.userId === myUserId;
    const me = meIsHome ? match.home : match.away;
    const opponent = meIsHome ? match.away : match.home;
    return `
      <div class="sim-result">
        <div class="side me">
          <div class="total">${fmt(me.total)}</div>
          <div class="label">Moi (${fmt(me.score)} buts)</div>
        </div>
        <div class="side">
          <div class="total">${fmt(opponent.total)}</div>
          <div class="label">Adversaire (${fmt(opponent.score)} buts)</div>
        </div>
      </div>`;
  }

  // Impact projeté sur le classement (division/ligue/Super Classement) du
  // scénario "Mon coup" en cours -- /simulate-classement recalcule la
  // division du manager avec son coup hypothétique tout en lisant les
  // AUTRES matchs/divisions/ligues tels qu'écrits par le dernier tick live.
  function rangDeltaHtml(current, baseline) {
    if (!baseline || current.rang === baseline.rang) return "";
    const delta = baseline.rang - current.rang; // positif = amélioration (rang plus petit)
    const cls = delta > 0 ? "up" : "down";
    return ` <span class="delta ${cls}">${delta > 0 ? "▲+" : "▼"}${delta}</span>`;
  }
  function classementItemHtml(label, current, baseline) {
    if (!current) return `<div class="item"><div class="rang">—</div><div class="label">${label}</div></div>`;
    return `
      <div class="item">
        <div class="rang">${current.rang}<span class="of">/${current.size}</span>${rangDeltaHtml(current, baseline)}</div>
        <div class="label">${label} · ${fmt(current.points)} pts</div>
      </div>`;
  }
  // Renvoie les items SEULS (pas de wrapper .sim-classement ici) -- le
  // conteneur qui reçoit ce HTML (root.querySelector(".sim-classement"))
  // porte déjà cette classe.
  function classementHtml(data, baseline) {
    return `
      ${classementItemHtml("Division", data.division, baseline && baseline.division)}
      ${classementItemHtml("Ligue", data.league, baseline && baseline.league)}
      ${data.superClassement ? classementItemHtml("Super Classement", data.superClassement, baseline && baseline.superClassement) : ""}`;
  }
  async function loadClassement(ctx, ownBonus, targetPlayerId) {
    const url = new URL(`${SIMULATE_API_BASE}/simulate-classement`);
    url.searchParams.set("shortId", ctx.leagueCode);
    url.searchParams.set("season", ctx.season);
    url.searchParams.set("division", ctx.division);
    url.searchParams.set("gameweek", ctx.gameWeek);
    url.searchParams.set("userId", ctx.userId);
    if (ownBonus) url.searchParams.set("ownBonus", ownBonus);
    if (targetPlayerId) url.searchParams.set("targetPlayerId", targetPlayerId);
    const res = await fetch(url);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  function classifyResult(myScore, theirScore) {
    if (myScore > theirScore) return "win";
    if (myScore < theirScore) return "loss";
    return "draw";
  }
  function computeOutcomeOdds(data) {
    const rowsByType = {};
    for (const s of data.scenarios) (rowsByType[s.opponentBonus] ||= []).push(s);
    const weights = { win: 0, draw: 0, loss: 0 };
    weights[classifyResult(data.baseline.myScore, data.baseline.theirScore)] += 1;
    let typeCount = 1;
    Object.values(rowsByType).forEach(rows => {
      typeCount += 1;
      const share = 1 / rows.length;
      rows.forEach(r => { weights[classifyResult(r.myScore, r.theirScore)] += share; });
    });
    return {
      win: Math.round((weights.win / typeCount) * 100),
      draw: Math.round((weights.draw / typeCount) * 100),
      loss: Math.round((weights.loss / typeCount) * 100),
      total: typeCount,
    };
  }
  function oddsBarHtml(data) {
    const odds = computeOutcomeOdds(data);
    const seg = (tone, pct) => pct > 0 ? `<span class="mpg-tag mpg-tag-${tone}" style="flex:${pct}">${pct}%</span>` : "";
    return `
      <p class="meta" style="margin:0.75rem 0 0.25rem;">Chances de résultat (à l'instant T)</p>
      <div style="display:flex; gap:0.25rem;">
        ${seg("success", odds.win)}${seg("gold", odds.draw)}${seg("danger", odds.loss)}
      </div>
      <p class="meta">Victoire ${odds.win}% · Nul ${odds.draw}% · Défaite ${odds.loss}% -- état actuel + 1 poids par type de bonus adverse possible (${odds.total} au total).</p>`;
  }
  function swingText(row) {
    const swing = row.deltaMine - row.deltaTheirs;
    if (swing === 0) return "=";
    return swing > 0 ? `+${swing}` : `${swing}`;
  }
  function sweepTableHtml(data, isHome) {
    // Ligne "Aucun" mise en avant (fond + bordure) -- l'adversaire peut
    // aussi ne jouer aucun bonus, c'est le scenario de reference.
    const baseline = data.baseline;
    const baselineHome = isHome ? baseline.myScore : baseline.theirScore;
    const baselineAway = isHome ? baseline.theirScore : baseline.myScore;
    const baselineRow = `
      <tr class="sweep-baseline">
        <td title="L'adversaire ne joue aucun bonus">Aucun</td>
        <td class="num">${baselineHome}</td>
        <td class="num">${baselineAway}</td>
        <td class="num">=</td>
      </tr>`;
    const rows = data.scenarios.map(s => {
      const homeScore = isHome ? s.myScore : s.theirScore;
      const awayScore = isHome ? s.theirScore : s.myScore;
      const swing = s.deltaMine - s.deltaTheirs;
      const swingClass = swing < 0 ? "sweep-bad" : "";
      return `
        <tr>
          <td title="${s.label}">${s.label}</td>
          <td class="num">${homeScore}</td>
          <td class="num">${awayScore}</td>
          <td class="num ${swingClass}">${swingText(s)}</td>
        </tr>`;
    }).join("");
    return `
      ${oddsBarHtml(data)}
      <div class="table-wrap">
        <table class="mpg-table">
          <thead><tr><th></th><th class="num">Domicile</th><th class="num">Extérieur</th><th class="num">Δ</th></tr></thead>
          <tbody>${baselineRow}${rows}</tbody>
        </table>
      </div>
      <p class="meta">Δ = évolution de la différence de buts en ma faveur si l'adversaire joue ce bonus (négatif = mauvais pour moi).</p>`;
  }

  function expanderShellHtml(row, league, theme, openByDefault) {
    const name = league ? league.nom.replace(/_/g, " ") : row.league_code;
    return `
      <details class="match-expander"${openByDefault ? " open" : ""}>
        <summary>
          <span class="summary-dot" style="background:${THEME_BAR[theme]}"></span>
          <span class="summary-league" style="color:${THEME_TEXT[theme]}">${name}</span>
          <span class="summary-division">Division ${row.division} · Journée ${row.game_week}</span>
          <span class="summary-score">Chargement...</span>
        </summary>
        <div class="expander-body">
          <div class="match-header"></div>
          <div class="lineups"></div>
          <div class="sim-card">
            <h2>Simulateur de bonus</h2>
            <p class="meta">Teste "et si je joue tel coup", et l'état des lieux de tous les coups adverses possibles, sans rien changer sur MPG.</p>
            <div class="sim-row">
              <label>Mon coup<select class="sim-own-bonus"></select></label>
              <span class="sim-target-wrap"></span>
            </div>
            <div class="sim-status status-msg">Chargement des compositions...</div>
            <div class="sim-result"></div>
            <div class="sim-classement"></div>
            <div class="sweep-panel"></div>
          </div>
        </div>
      </details>`;
  }

  // Un controleur par bloc -- son propre "lastBaselineMatch", jamais
  // partage entre blocs (contrairement a match.html, singleton par page).
  // Toutes les recherches DOM sont scopees a `root` (root.querySelector),
  // jamais document.getElementById -- plusieurs blocs coexistent.
  async function createBlockController(root, ctx) {
    let lastBaselineMatch = null;
    let lastClassementBaseline = null;
    let homeName = "", awayName = "";

    function refreshClassement(ownBonus, targetPlayerId, baseline) {
      const el = root.querySelector(".sim-classement");
      if (!el) return;
      el.innerHTML = `<p class="meta">Classement projeté : calcul en cours...</p>`;
      loadClassement(ctx, ownBonus, targetPlayerId)
        .then(data => { el.innerHTML = classementHtml(data, baseline); })
        .catch(e => { el.innerHTML = `<p class="status-msg err">Classement projeté indisponible (${e.message}).</p>`; });
    }

    async function runSweep(ownBonus, targetPlayerId, isHome) {
      const sweepEl = root.querySelector(".sweep-panel");
      sweepEl.innerHTML = `<p class="meta">Bonus adverse -- état des lieux : analyse en cours...</p>`;
      try {
        const url = new URL(`${SIMULATE_API_BASE}/live-scenario-sweep`);
        url.searchParams.set("shortId", ctx.leagueCode);
        url.searchParams.set("season", ctx.season);
        url.searchParams.set("division", ctx.division);
        url.searchParams.set("gameweek", ctx.gameWeek);
        url.searchParams.set("userId", ctx.userId);
        if (ownBonus) url.searchParams.set("ownBonus", ownBonus);
        if (targetPlayerId) url.searchParams.set("targetPlayerId", targetPlayerId);
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        sweepEl.innerHTML = `<h3 style="font-size:0.9rem;">Bonus adverse -- état des lieux</h3>` + sweepTableHtml(data, isHome);
      } catch (e) {
        sweepEl.innerHTML = `<p class="status-msg err">Bonus adverse indisponible (${e.message}).</p>`;
      }
    }

    function updateTargetVisibility() {
      const ownBonus = root.querySelector(".sim-own-bonus").value;
      const wrap = root.querySelector(".sim-target-wrap");
      if (!lastBaselineMatch) { wrap.innerHTML = ""; return; }
      const meIsHome = lastBaselineMatch.home.userId === ctx.userId;
      const myTeam = meIsHome ? lastBaselineMatch.home : lastBaselineMatch.away;
      const hidden = !BONUS_NEEDS_TARGET.has(ownBonus);
      wrap.innerHTML = `<label>Cible (McDo+)${targetSelectHtml(myTeam, "", hidden)}</label>`;
      // Auto-simule des qu'une cible McDo+ est choisie (pas de bouton
      // "Simuler" -- ca ralentissait la navigation) -- le select est recree
      // a chaque appel (innerHTML ci-dessus), le listener doit donc etre
      // rattache a chaque fois.
      const targetSelect = root.querySelector(".sim-target-player");
      if (targetSelect) targetSelect.addEventListener("change", simulate);
    }

    async function simulate() {
      const statusEl = root.querySelector(".sim-status");
      const resultEl = root.querySelector(".sim-result");
      const ownBonus = root.querySelector(".sim-own-bonus").value;
      const targetSelect = root.querySelector(".sim-target-player");
      const targetPlayerId = targetSelect ? targetSelect.value : "";

      statusEl.textContent = "Simulation en cours...";
      statusEl.className = "sim-status status-msg";
      resultEl.innerHTML = "";

      try {
        const url = new URL(`${SIMULATE_API_BASE}/simulate-bonus`);
        url.searchParams.set("shortId", ctx.leagueCode);
        url.searchParams.set("season", ctx.season);
        url.searchParams.set("division", ctx.division);
        url.searchParams.set("gameweek", ctx.gameWeek);
        url.searchParams.set("userId", ctx.userId);
        if (ownBonus) url.searchParams.set("ownBonus", ownBonus);
        if (targetPlayerId) url.searchParams.set("targetPlayerId", targetPlayerId);
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = "Erreur : " + (data.error || res.statusText);
          statusEl.className = "sim-status status-msg err";
          return;
        }
        statusEl.textContent = "";
        lastBaselineMatch = data;
        resultEl.innerHTML = simResultHtml(data, ctx.userId);
        // Rejoue l'en-tete ET les compositions avec le coup simule -- meme
        // si le bonus change le nombre de buteurs, le score reel reste
        // identique tant que rien n'est ecrit sur MPG (bandeau signale
        // "scenario simule" pour eviter toute confusion).
        root.querySelector(".match-header").innerHTML = matchHeaderHtml(data, homeName, awayName, ctx.gameWeek, true);
        root.querySelector(".lineups").innerHTML = compositionsHtml(data, homeName, awayName);
        const meIsHome = data.home.userId === ctx.userId;
        runSweep(ownBonus, targetPlayerId, meIsHome);
        refreshClassement(ownBonus, targetPlayerId, lastClassementBaseline);
      } catch (e) {
        statusEl.textContent = "Simulation indisponible pour le moment (" + e.message + ").";
        statusEl.className = "sim-status status-msg err";
      }
    }

    const statusEl = root.querySelector(".sim-status");
    const ownSelect = root.querySelector(".sim-own-bonus");
    ownSelect.innerHTML = optionsHtml(bonusOptionsForDivisionSize(ctx.divisionSize), "");
    // Auto-simule directement au changement de coup (pas de bouton
    // "Simuler" -- ralentissait la navigation).
    ownSelect.addEventListener("change", () => {
      updateTargetVisibility();
      simulate();
    });

    try {
      const url = new URL(`${SIMULATE_API_BASE}/simulate-bonus`);
      url.searchParams.set("shortId", ctx.leagueCode);
      url.searchParams.set("season", ctx.season);
      url.searchParams.set("division", ctx.division);
      url.searchParams.set("gameweek", ctx.gameWeek);
      url.searchParams.set("userId", ctx.userId);
      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      lastBaselineMatch = data;

      homeName = ctx.nameFor(data.home.userId);
      awayName = ctx.nameFor(data.away.userId);
      root.querySelector(".match-header").innerHTML = matchHeaderHtml(data, homeName, awayName, ctx.gameWeek);
      root.querySelector(".lineups").innerHTML = compositionsHtml(data, homeName, awayName);
      const opponentName = data.home.userId === ctx.userId ? awayName : homeName;
      root.querySelector(".summary-score").textContent = `vs ${opponentName} · ${fmt(data.home.score)} – ${fmt(data.away.score)}`;

      statusEl.textContent = "";
      updateTargetVisibility();
      const meIsHome = data.home.userId === ctx.userId;
      root.querySelector(".sweep-panel").innerHTML = "";
      await runSweep("", "", meIsHome);

      // Classement REEL en cours (aucun bonus hypothétique) -- référence
      // pour les ▲/▼ affichés dès qu'un coup est ensuite testé.
      const classementEl = root.querySelector(".sim-classement");
      if (classementEl) classementEl.innerHTML = `<p class="meta">Classement projeté : calcul en cours...</p>`;
      loadClassement(ctx, "", "")
        .then(data => {
          lastClassementBaseline = data;
          if (classementEl) classementEl.innerHTML = classementHtml(data, null);
        })
        .catch(e => {
          if (classementEl) classementEl.innerHTML = `<p class="status-msg err">Classement projeté indisponible (${e.message}).</p>`;
        });
    } catch (e) {
      statusEl.textContent = "Simulateur indisponible pour le moment (" + e.message + "). Le service met parfois jusqu'à 30s à se réveiller.";
      statusEl.className = "sim-status status-msg err";
      root.querySelector(".summary-score").textContent = "indisponible";
    }
  }

  async function load() {
    const userId = document.getElementById("global-manager").value;
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");
    listEl.innerHTML = "";

    if (!userId) {
      statusEl.textContent = "Choisis un manager ci-dessus pour voir ses simulations en direct.";
      statusEl.className = "status-msg";
      return;
    }

    statusEl.textContent = "Chargement...";
    statusEl.className = "status-msg";

    const [{ data: divData, error }, { data: leaguesData }, { data: managersData }] = await Promise.all([
      supabase.from("division_classement_live").select("*").eq("is_live", true),
      supabase.from("leagues").select("code, nom, season_search, players_per_division"),
      supabase.from("managers").select("user_id, real_name"),
    ]);

    if (error) {
      statusEl.textContent = "Erreur : " + error.message;
      statusEl.className = "status-msg err";
      return;
    }

    const leaguesByCode = Object.fromEntries((leaguesData || []).map(l => [l.code, l]));
    const realNameByUid = Object.fromEntries((managersData || []).map(m => [m.user_id, m.real_name]));
    const nameFor = uid => realNameByUid[uid] || uid;

    const myLiveRows = (divData || []).filter(row => (row.data || []).some(e => e.userId === userId));

    if (!myLiveRows.length) {
      statusEl.textContent = "Aucune division en direct pour ce manager en ce moment (aucune journée en cours).";
      return;
    }

    statusEl.textContent = "";
    // Repli sur des expanders REPLIES par defaut des que plusieurs matchs
    // sont en direct en meme temps -- ouvrir TOUS les blocs par defaut
    // revenait a tout afficher en meme temps, aucun gain reel par rapport
    // a l'absence d'expander. Un seul match en direct reste ouvert d'office.
    const openByDefault = myLiveRows.length === 1;
    listEl.innerHTML = myLiveRows.map(row => {
      const league = leaguesByCode[row.league_code];
      const theme = leagueTheme(league && league.nom);
      return expanderShellHtml(row, league, theme, openByDefault);
    }).join("");

    const blocks = listEl.querySelectorAll(".match-expander");
    await Promise.all(myLiveRows.map((row, i) => {
      const league = leaguesByCode[row.league_code];
      const ctx = {
        leagueCode: row.league_code, season: league.season_search, division: row.division,
        gameWeek: row.game_week, userId, divisionSize: league.players_per_division, nameFor,
      };
      return createBlockController(blocks[i], ctx);
    }));
  }

  await initGlobalManagerSelector();
  load();
</script>
