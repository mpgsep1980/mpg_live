<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPG Live -- Accueil</title>
<link rel="stylesheet" href="mpg-tokens.css">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: var(--mpg-title); }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  .meta { color: var(--mpg-text-soft); font-size: 0.85rem; }
  .status-msg { color: var(--mpg-text-soft); font-size: 0.9rem; margin: 1rem 0; }
  .status-msg.err { color: var(--mpg-danger); }

  /* Retour utilisateur 2026-08-26 : "les autres onglets sont masques ...
     une autre application gere les classements donc on evite un doublon"
     -- Accueil n'affiche plus d'apercu de classement (Resume/Mes ligues/
     Super Classement, tous supprimes avec ce meme correctif), juste un
     point d'entree minimal vers l'onglet Live. */
  .hero { border: 0.5px solid var(--mpg-border-soft); border-radius: var(--mpg-radius); padding: 1.5rem; margin: 1.5rem 0; text-align: center; }
  .hero p { margin: 0 0 1rem; color: var(--mpg-text-soft); }
  .hero a.cta {
    display: inline-block; background: var(--mpg-action); color: #fff; text-decoration: none;
    border-radius: var(--mpg-radius); padding: 0.6rem 1.4rem; font-weight: 600; font-size: 0.95rem;
  }
  .hero a.cta:hover { background: var(--mpg-action-hover); }
</style>
</head>
<body>

<header class="mpg-banner mpg-no-print">
  <div class="mpg-banner-inner">
    <a class="mpg-banner-title" href="index.html">MPG part en LIVE</a>
    <nav class="mpg-banner-nav">
      <a class="mpg-banner-item" href="index.html">Accueil</a>
      <a class="mpg-banner-item" href="simulations.html">Live</a>
    </nav>
    <label class="mpg-banner-manager mpg-no-print">
      <select id="global-manager"><option value="">— Manager —</option></select>
    </label>
  </div>
</header>
<script>
  for (const a of document.querySelectorAll(".mpg-banner-item")) {
    if (a.pathname === location.pathname) a.classList.add("is-active");
  }
</script>

<h1 id="title">Accueil</h1>
<div id="status" class="status-msg">Chargement...</div>

<div id="content" class="hero" style="display:none">
  <p id="welcome-text"></p>
  <a class="cta" id="live-link" href="simulations.html">Aller au Live &rarr;</a>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL = "https://zvmngpoogwjiknqrkjky.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_YhAD0_spZJF58Dt_TTQplQ_VrFSKRK8";
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Retour utilisateur 2026-08-24 : "reprends le selecteur manager existant"
  // (pas de vrai login -- accounts/verify_manager_password existent dans le
  // schema mais ne sont brancges nulle part). Persiste juste le choix en
  // localStorage pour eviter de re-choisir a chaque visite -- pas une vraie
  // session, un simple confort, ecrasable par ?user= dans l'URL.
  const STORAGE_KEY = "mpg_live_user_id";
  const params = new URLSearchParams(location.search);

  // Selecteur de manager global (bandeau, cf. mpg-tokens.css) -- meme
  // composant duplique sur chaque page (pas de module JS partage sur ce
  // site). localStorage + ?user= (URL prioritaire au premier chargement).
  async function initGlobalManagerSelector() {
    const { data } = await supabase.from("managers").select("user_id, real_name").order("real_name");
    const select = document.getElementById("global-manager");
    select.innerHTML = `<option value="">— Manager —</option>`
      + (data || []).map(m => `<option value="${m.user_id}">${m.real_name}</option>`).join("");
    const wanted = params.get("user") || localStorage.getItem(STORAGE_KEY) || "";
    if (wanted) select.value = wanted;
    select.addEventListener("change", async () => {
      const uid = select.value;
      if (uid) localStorage.setItem(STORAGE_KEY, uid); else localStorage.removeItem(STORAGE_KEY);
      const url = new URL(location.href);
      if (uid) url.searchParams.set("user", uid); else url.searchParams.delete("user");
      location.href = url.toString();
    });
    return { wanted, realNameByUid: Object.fromEntries((data || []).map(m => [m.user_id, m.real_name])) };
  }

  async function load() {
    const { wanted, realNameByUid } = await initGlobalManagerSelector();
    const statusEl = document.getElementById("status");
    const contentEl = document.getElementById("content");
    const titleEl = document.getElementById("title");

    if (!wanted) {
      statusEl.textContent = "Choisis un manager ci-dessus pour continuer.";
      statusEl.className = "status-msg";
      contentEl.style.display = "none";
      titleEl.textContent = "Accueil";
      return;
    }

    const name = realNameByUid[wanted] || wanted;
    titleEl.textContent = name;
    statusEl.textContent = "";
    document.getElementById("welcome-text").textContent =
      `Salut ${name} — retrouve tes matchs en direct, ta place en division/ligue et au Super Classement dans l'onglet Live.`;
    document.getElementById("live-link").href = `simulations.html?user=${wanted}`;
    contentEl.style.display = "";
  }

  load();
</script>

<footer class="mpg-footer mpg-no-print">© Créé par Sep et Ilan et David (le chien)</footer>

</body>
</html>
